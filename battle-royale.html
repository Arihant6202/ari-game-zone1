<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪂</text></svg>">
<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:78px;display:grid;place-items:center}
.azitem .fig{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.azitem .fig svg{max-width:100%}
.azitem.eq .fig{box-shadow:inset 0 0 0 1px var(--a3)}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.coinbig,.azpill.coin,#azcoins,#hC,#hCoin,#mycoins{color:#ffbf24!important}.az-coin-icon{width:1.22em;height:1.22em;object-fit:contain;vertical-align:-.22em;display:inline-block;filter:drop-shadow(0 1px 2px rgba(255,190,30,.35))}</style>
<style>
.azgame{width:min(920px,100% - 12px);margin-top:6px;gap:6px}
#cv{width:100%;height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:360px;max-height:760px;touch-action:none;cursor:crosshair}
.azhud .azpill{font-size:12px;padding:5px 9px}
.low{color:var(--bad)!important;border-color:var(--bad)!important}
</style>
</head>
<body data-game="br">
<main class="azgame">
  <div class="azhud" id="hud"></div>
  <canvas id="cv"></canvas>
  <div class="azmsg" id="msg" style="min-height:20px;font-size:13px">Loot crates 🩹🛡️⚡🔫 · stay inside the blue zone · last one alive wins</div>
  <div class="azctl"><button class="azbtn ghost sm" id="rst">🔄 Restart</button><button class="azbtn ghost sm" id="gfx">🎨 Graphics</button></div>
</main>
<script src="az.js?v=1.01.03"></script>
<script>
/* Top-down shooter engine for Zone Survivor (battle royale) and Arena Strike (team deathmatch).
   Shooter.run({cv, mode:'br'|'arena', level, diff, hud(fn), end(fn)}) -> {stop(), S} */
window.Shooter=(function(){
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=(a,b)=>Math.hypot(a,b);
const angd=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);return 'rgb('+Math.round((t-r)*p+r)+','+Math.round((t-g)*p+g)+','+Math.round((t-b)*p+b)+')';}
function lum(hex){const n=parseInt(hex.slice(1),16);return(((n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11))/255;}

function run(o){
  const net=o.net||null,coop=!!(net&&o.extra&&o.extra.mode==='coop');
  const cv=o.cv,ctx=cv.getContext('2d'),L=o.level,D=o.diff,mode=o.mode,place=Az.place(L);
  const dm=Az.pick(D,.75,1,1.3),br=mode==='br',WORLD=br?2600:1400;
  const rng=Az.rng(L*977+(br?1:2)+(D==='hard'?5:D==='easy'?3:0));
  const guns=Az.items('gun');
  const S={t:0,ents:[],bul:[],loot:[],parts:[],txt:[],feed:[],obs:[],over:false,shake:0,zone:null,teamKills:[0,0],killTarget:Math.round(10+L*.3),time:150,msg:''};
  /* ---------- map ---------- */
  const CELL=128,grid=new Map();
  function addObs(r){S.obs.push(r);for(let gx=Math.floor(r.x/CELL);gx<=Math.floor((r.x+r.w)/CELL);gx++)for(let gy=Math.floor(r.y/CELL);gy<=Math.floor((r.y+r.h)/CELL);gy++){const k=gx+','+gy;(grid.get(k)||grid.set(k,[]).get(k)).push(r);}}
  const dens=br?.3:.22;
  for(let gx=1;gx<WORLD/220-1;gx++)for(let gy=1;gy<WORLD/220-1;gy++){if(rng()>dens)continue;const w=60+rng()*110,h=50+rng()*110;addObs({x:gx*220+rng()*40,y:gy*220+rng()*40,w,h,k:rng()<.3?'crate':rng()<.5?'tree':'wall'});}
  const ground=place.ground,gl=lum(ground),wallC=gl>.45?shade(ground,-.5):shade(ground,.35),wallTop=gl>.45?shade(ground,-.3):shade(ground,.55);
  function near(x,y,r){const out=[];for(let gx=Math.floor((x-r)/CELL);gx<=Math.floor((x+r)/CELL);gx++)for(let gy=Math.floor((y-r)/CELL);gy<=Math.floor((y+r)/CELL);gy++){const a=grid.get(gx+','+gy);if(a)for(const q of a)if(!out.includes(q))out.push(q);}return out;}
  function pushOut(e){for(const r of near(e.x,e.y,e.r+4)){const cx=clamp(e.x,r.x,r.x+r.w),cy=clamp(e.y,r.y,r.y+r.h),dx=e.x-cx,dy=e.y-cy,d=rad(dx,dy);if(d<e.r){if(d>.001){e.x+=dx/d*(e.r-d);e.y+=dy/d*(e.r-d);}else e.y-=e.r;e.hit=true;}}
    e.x=clamp(e.x,e.r,WORLD-e.r);e.y=clamp(e.y,e.r,WORLD-e.r);}
  const blocked=(x,y)=>{const a=grid.get(Math.floor(x/CELL)+','+Math.floor(y/CELL));if(a)for(const r of a)if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return true;return false;};
  function los(a,b){const d=rad(b.x-a.x,b.y-a.y),n=Math.ceil(d/28);for(let i=1;i<n;i++){if(blocked(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n))return false;}return true;}
  function freeSpot(x0,y0,x1,y1){for(let i=0;i<200;i++){const x=x0+rng()*(x1-x0),y=y0+rng()*(y1-y0);const t={x,y,r:16};let ok=!blocked(x,y);for(const r of near(x,y,30))if(x>r.x-26&&x<r.x+r.w+26&&y>r.y-26&&y<r.y+r.h+26)ok=false;if(ok)return{x,y};}return{x:x0,y:y0};}
  /* ---------- entities ---------- */
  const outfit=Az.eq('outfit'),pg=Az.eq('gun');
  function mkGun(g){return{name:g.name,color:g.color,dmg:g.dmg,rate:g.rate,pellets:g.pellets,spread:g.spread,speed:g.speed,mag:g.mag||Math.max(5,Math.round(g.rate*3.5)),range:g.range||(g.speed>15?950:520)};}
  function mk(o2){const e=Object.assign({x:0,y:0,r:16,vx:0,vy:0,ang:0,cool:0,reload:0,armor:0,kills:0,alive:true,dead:0,boost:0,inv:0,tgt:null,think:0,goal:null,react:0,stuck:0,lastp:{x:0,y:0},sf:1+rng()*2,id:S.ents.length},o2);e.maxhp=e.hp;e.ammo=e.gun.mag;return e;}
  function spawnPlayer(){const p=br?freeSpot(300,300,WORLD-300,WORLD-300):freeSpot(60,WORLD/2-250,220,WORLD/2+250);return p;}
  const P=mk({player:true,team:br?0:0,hp:outfit.hp+Az.perk().hp,color:outfit.color,hat:outfit.hat,gun:mkGun(pg),name:Az.name(),...spawnPlayer()});P.inv=2.5;S.ents.push(P);S.P=P;
  const nBots=net?(coop?14:0):br?Math.min(39,9+Math.floor(L*.3)):Math.min(7,3+Math.floor(L/22));
  const botHp=Math.round((55+L*.9)*Az.pick(D,.8,1,1.2)),botErr=Math.max(.025,(.34-L*.0029))*Az.pick(D,1.5,1,.7),botDmg=(.55+L*.0075)*dm;
  function botGun(){const tier=Math.min(5,Math.floor(rng()*(1.2+L/18)));return mkGun(guns[tier]);}
  function mkBot(team,x,y,i){const hue=br?Math.floor(rng()*360):(team===0?200:0);const b=mk({team:br?i+1:team,hp:botHp,color:br?'hsl('+hue+' 70% 55%)':(team===0?'hsl('+(190+i*10)+' 80% 55%)':'hsl('+(i*12)+' 85% 52%)'),hat:['','🪖','🎩','🧢',''][i%5],gun:botGun(),name:'Bot'+(i+1),bot:true,x,y,speed:(108+L*.55)*Az.pick(D,.85,1,1.1),turn:3+L*.05,reactT:Math.max(.12,.7-L*.006)*Az.pick(D,1.4,1,.75),dmgMul:botDmg,err:botErr});S.ents.push(b);return b;}
  if(br){for(let i=0;i<nBots;i++){const p=freeSpot(150,150,WORLD-150,WORLD-150);mkBot(0,p.x,p.y,i);}}
  else{for(let i=0;i<nBots;i++){const a=freeSpot(60,WORLD/2-300,260,WORLD/2+300),e=freeSpot(WORLD-260,WORLD/2-300,WORLD-60,WORLD/2+300);if(i<nBots-1)mkBot(0,a.x,a.y,i);mkBot(1,e.x,e.y,i+20);}}
  /* loot (battle royale) */
  if(br){for(let i=0;i<46;i++){const p=freeSpot(100,100,WORLD-100,WORLD-100),r=rng(),type=r<.34?'med':r<.6?'armor':r<.78?'boost':'gun';const tier=Math.min(5,1+Math.floor(rng()*rng()*5));S.loot.push({x:p.x,y:p.y,type,g:type==='gun'?guns[tier]:null,bob:rng()*6});}
    const rz=[.62,.42,.27,.16,.08,.03].map(k=>k*WORLD);let c={x:WORLD/2,y:WORLD/2};const wait=Math.max(7,14-L*.06);
    S.zone={phases:rz,k:-1,state:'wait',timer:wait+4,wait,x:c.x,y:c.y,r:WORLD*.75,fx:c.x,fy:c.y,fr:WORLD*.75,tx:c.x,ty:c.y,tr:rz[0]};}
  /* ---------- shooting / damage ---------- */
  function fire(e){if(!e.alive||e.cool>0||e.reload>0)return;if(e.ammo<=0){e.reload=e.gun.pellets>1?1.5:1.1;return;}
    const g=e.gun;e.cool=1/g.rate;e.ammo--;
    for(let i=0;i<g.pellets;i++){const a=e.ang+(Math.random()-.5)*2*(g.spread+(e.err||0));S.bul.push({x:e.x+Math.cos(e.ang)*18,y:e.y+Math.sin(e.ang)*18,vx:Math.cos(a)*g.speed*60,vy:Math.sin(a)*g.speed*60,dmg:g.dmg*(e.dmgMul||1)*(e.boost>0?1.5:1),team:e.team,o:e,life:g.range/(g.speed*60),col:g.color});}
    if(net&&(e.player||(net.host&&e.bot))){const mb=S.bul.slice(-g.pellets).map(q=>({x:q.x,y:q.y,vx:q.vx,vy:q.vy,dmg:q.dmg,life:q.life,col:q.col}));net.send(e.bot?{t:'f',tm:e.team,bid:e.id,b:mb}:{t:'f',b:mb});}
    if(e.player){Az.sfx('shoot');S.shake=Math.min(6,S.shake+(g.dmg>50?5:1.5));}

    for(const e of S.ents){if(!e.alive)continue;ctx.fillStyle=e===P?'#fff':(e.team===P.team?'#3dd9ff':'#ff6b6b');ctx.fillRect(mx+e.x*k-1.5,my+e.y*k-1.5,e===P?4:3,e===P?4:3);}
    ctx.font='12px Poppins,sans-serif';ctx.textAlign='left';S.feed.forEach((f,j)=>{ctx.globalAlpha=Math.min(1,f.l);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(8,8+j*20,ctx.measureText(f.t).width+12,18);ctx.fillStyle='#fff';ctx.fillText(f.t,14,21+j*20);});ctx.globalAlpha=1;
    for(const id in sticks){const s2=sticks[id],dx=s2.x-s2.ox,dy=s2.y-s2.oy,d=Math.min(50,rad(dx,dy)),a=Math.atan2(dy,dx);ctx.strokeStyle=s2.kind==='aim'?'rgba(255,90,120,.7)':'rgba(120,220,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s2.ox,s2.oy,50,0,TAU);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(s2.ox+Math.cos(a)*d,s2.oy+Math.sin(a)*d,20,0,TAU);ctx.fill();}}
  function render(){if(T)render3();else render2d();}
  if(br&&lsv('az_3d')!=='0'){const go=()=>{if(stopped)return;try{T=init3d();AY=1.25;if(P.hat==='🦋')loadModel();setTimeout(()=>{if(R&&R.hat==='🦋'&&window.THREE)loadModel();},600);}catch(e){T=null;}};
    if(window.THREE)go();else{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';sc.onload=go;document.head.appendChild(sc);}}
  /* ---------- online (PeerJS): 1v1 duel or co-op duo. Victim-authoritative; host runs bots + zone ---------- */
  let R=null,netT=0,bt=0,zt=0;
  if(net){const sp=(net.host||coop)?freeSpot(300,300,1000,1000):freeSpot(WORLD-1000,WORLD-1000,WORLD-300,WORLD-300);P.x=sp.x;P.y=sp.y;
    R=mk({team:coop?0:1000,hp:100,color:'#ff6b6b',hat:'',gun:mkGun(guns[0]),name:(net.peer&&net.peer.name)|| (coop?'Ally':'Rival'),remote:true,x:coop?sp.x+40:(net.host?WORLD-600:600),y:coop?sp.y:(net.host?WORLD-600:600)});R.tx=R.x;R.ty=R.y;S.ents.push(R);
    if(coop&&!net.host)for(const e of S.ents)if(e.bot){e.puppet=true;e.tx=e.x;e.ty=e.y;}
    net.send({t:'hi',c:P.color,h:P.hat,mh:P.maxhp});
    net.on(m=>{if(!m||S.over)return;
      if(m.t==='s'){R.tx=m.x;R.ty=m.y;R.ang=m.a;R.hp=m.hp;R.armor=m.ar;R.alive=!!m.al;const g=guns.find(x=>x.name===m.gn);if(g&&R.gun.name!==g.name)R.gun=mkGun(g);}
      else if(m.t==='hi'){R.name=(net.peer&&net.peer.name)||R.name;R.color=m.c;R.hat=m.h;R.maxhp=m.mh;if(T){const g=T.ch.get(R);if(g){T.sc.remove(g);T.ch.delete(R);}}if(R.hat==='🦋'&&window.THREE)loadModel();}
      else if(m.t==='f'){const bot=m.bid!=null;for(const q of m.b)S.bul.push({x:q.x,y:q.y,vx:q.vx,vy:q.vy,dmg:q.dmg,life:q.life,col:q.col,team:bot?m.tm:R.team,o:bot?S.ents[m.bid]:R,rem:true});}
      else if(m.t==='k'){P.kills++;S.feed.unshift({t:'You ⚔ '+R.name,l:5});}
      else if(m.t==='l'){const l=S.loot[m.i];if(l)l.gone=true;}
      else if(m.t==='ld'){S.loot.push({x:m.x,y:m.y,type:m.type,bob:0});}
      else if(m.t==='h'){const e=S.ents[m.id];if(e&&e.bot&&e.alive)hurt(e,m.d,R);}
      else if(m.t==='z'&&S.zone){const ks=['x','y','r','k','state','timer','fx','fy','fr','tx','ty','tr','wait'];ks.forEach((k,i)=>{S.zone[k]=m.z[i];});}
      else if(m.t==='b'){for(const a of m.a){const e=S.ents[a[0]];if(!e||!e.puppet)continue;e.tx=a[1];e.ty=a[2];e.ang=a[3];e.hp=a[4];e.alive=!!a[5];if(e.gun.name!==a[6]){const g=guns.find(x=>x.name===a[6]);if(g)e.gun=mkGun(g);}}}});
    net.onclose(()=>{if(S.over)return;if(!coop)endGame(true,'Rival left the game');else if(net.host){R.alive=false;S.msg='Ally left the game';}else endGame(false,'Host left the game');});}
  raf=requestAnimationFrame(loop);
  return{S,stop(){stopped=true;if(net)net.on(()=>{});if(T){try{T.rd.domElement.remove();T.rd.dispose();}catch(e){}T=null;}cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);document.removeEventListener('visibilitychange',vis);}};
}
return{run};
})();

<script>
(function(){
const $=id=>document.getElementById(id);let G=null,O,level;
function hud(h){
  const pills=[['❤️ '+h.hp+'/'+h.maxhp,h.hp<h.maxhp*.3],['🛡️ '+h.armor,0],['🔫 '+h.gun+' '+(h.reload?'⟳ reloading':h.ammo+'/'+h.mag)+(h.boost?' ⚡':''),0],['👥 '+h.alive+' alive',0],['☠️ '+h.kills,0],['🌀 '+h.zone,!h.inZone]];
  $('hud').innerHTML=pills.map(p=>'<span class="azpill '+(p[1]?'low':'')+'">'+p[0]+'</span>').join('');
  if(h.msg)$('msg').textContent=h.msg;
}
function begin(lv){
  if(G)G.stop();level=lv;const pl=Az.place(level);Az.setBadge('Lv '+level+' · '+pl.emoji+' '+pl.name);$('msg').textContent='Loot crates 🩹🛡️⚡🔫 · stay inside the blue zone · last one alive wins';
  G=Shooter.run({cv:$('cv'),mode:'br',level,diff:O.diff,net:O.mode==='online'?O.net:null,extra:O.extra,hud,end:r=>{
    Az.finish({game:'br',level,diff:O.diff,won:r.won,progress:O.mode!=='online',base:60+r.kills*10,score:r.kills,title:r.won?'🏆 Winner Winner!':'Eliminated!',sub:r.sub,next:lv=>begin(lv),retry:lv=>O.mode==='online'?location.reload():begin(lv)});}});
}
$('rst').onclick=()=>O&&O.mode!=='online'&&begin(O.level);
$('gfx').onclick=()=>{try{const off=localStorage.getItem('az_3d')==='0',low=localStorage.getItem('az_low')==='1';
  if(off){localStorage.setItem('az_3d','1');localStorage.setItem('az_low','0');Az.toast('🎨 3D High');}
  else if(low){localStorage.setItem('az_3d','0');Az.toast('🖼️ 2D mode');}
  else{localStorage.setItem('az_low','1');Az.toast('⚡ 3D Low graphics');}}catch(e){}if(O&&O.mode!=='online')begin(O.level);};
Az.start({game:'br',extra:[{key:'mode',label:'Online mode (online only)',options:[['duel','⚔️ 1v1 Duel'],['coop','🤝 Co-op Duo']]}],onStart:o=>{O=o;begin(o.level);}});
window.__sh={get G(){return G;},begin:l=>{O=O||{diff:'medium'};begin(l);}};
})();
