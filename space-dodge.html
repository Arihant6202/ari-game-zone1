<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="./icon-64.png" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="shortcut icon" href="favicon.ico"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Dodge · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=18"></head><body data-game="spacedodge"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">🚀</div><h1>Space Dodge</h1><p class="sub">Dodge incoming asteroids.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=18"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false;function finish(won,sub){if(done)return;done=true;Az.finish({game:'spacedodge',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}function start(){Az.start({game:'spacedodge',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;run()}})}$('start').onclick=start;let ship=1,rocks=[],tick=0,loop;function run(){ship=1;rocks=[];tick=0;score=0;$('gamearea').innerHTML='<div id="space" style="height:260px;background:#05091d;border:1px solid #5366ff;border-radius:16px;display:grid;place-items:center;font-size:34px">🚀</div><div class="azrow c"><button class="azbtn ghost" id="left">⬅</button><button class="azbtn ghost" id="right">➡</button></div>';const area=$('space');function paint(){if(done)return;tick++;if(tick%9===0)rocks.push(Math.floor(Math.random()*3));if(rocks.includes(ship)){clearInterval(loop);finish(false,'Asteroid collision. Score: '+score);return}score++;area.innerHTML='<div style="font-size:24px;line-height:1.5">'+rocks.map((r,i)=>'<span style="display:inline-block;width:30%">'+(r===0?'☄️':'　')+'</span>').join('')+'<br>'+[0,1,2].map(i=>'<span style="display:inline-block;width:30%">'+(ship===i?'🚀':'　')+'</span>').join('')+'</div><small>Score '+score+'</small>';rocks=rocks.slice(-3)}$('left').onclick=()=>ship=Math.max(0,ship-1);$('right').onclick=()=>ship=Math.min(2,ship+1);loop=setInterval(paint,500)}})();</script></body></html>
