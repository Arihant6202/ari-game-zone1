<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest?v=21"><link rel="icon" href="./icon-64.png?v=21" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=21"><link rel="shortcut icon" href="favicon.ico?v=21"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:image" content="./share-image.png?v=21"><title>Shop · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=21"><link rel="stylesheet" href="v17.css?v=21"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="shop"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>🛒 Shop</h1><span class="azpill coin">🪙 <b data-az="coins">0</b> Gold</span></div><p style="color:var(--muted)">Every game has its own shop. Pick a game to buy and equip items for it.</p><div class="grid2" id="slots"></div></div><script src="az.js?v=21"></script><script src="nav.js"></script><script>
const box=document.getElementById('slots');
box.innerHTML='<div class="tile"><b>🛍️</b><p>All items</p><button class="azbtn" id="all">Open full shop</button></div>'+Az.GAMES.map(function(g){const n=g.shop.reduce(function(a,k){return a+(Az.SHOP[k]?Az.SHOP[k].items.length:0)},0);
 return '<div class="tile"><b>'+g.emoji+'</b><p style="margin:4px 0 2px;font-weight:700">'+g.name+'</p><small style="color:var(--muted)">'+(n?n+' items · '+g.shop.map(function(k){return Az.SHOP[k].title}).join(', '):'No items yet')+'</small><br>'+(n?'<button class="azbtn ghost sm" style="margin-top:8px" data-g="'+g.id+'">Open '+g.name+' shop</button>':'<button class="azbtn ghost sm" style="margin-top:8px" disabled>Coming soon</button>')+'</div>'}).join('');
document.getElementById('all').onclick=function(){Az.shop()};
box.onclick=function(e){const b=e.target.closest('[data-g]');if(!b)return;const g=Az.GAMES.find(function(x){return x.id===b.dataset.g});Az.shop(g.shop)};
</script></body></html>
