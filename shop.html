<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ari-game-zone-icon.svg" type="image/svg+xml"><title>Shop · Ari Game Zone</title><link rel="stylesheet" href="az.css"><link rel="stylesheet" href="v17.css"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="shop"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>🛒 Shop</h1><span class="azpill coin">🪙 <b data-az="coins">0</b> Gold</span></div><p style="color:var(--muted)">Pick a category. Items you own can be equipped from the same screen.</p><div class="grid2" id="slots"></div></div><script src="az.js?v=17"></script><script src="nav.js"></script><script>
const box=document.getElementById('slots');box.innerHTML='<div class="tile"><b>🛍️</b><p>All items</p><button class="azbtn" id="all">Open shop</button></div>'+Object.keys(Az.SHOP).map(k=>'<div class="tile"><b>'+Az.SHOP[k].emoji+'</b><p>'+(Az.SHOP[k].name||k)+'</p><button class="azbtn ghost" data-s="'+k+'">Browse</button></div>').join('');
document.getElementById('all').onclick=()=>Az.shop();box.onclick=e=>{const b=e.target.closest('[data-s]');if(b)Az.shop([b.dataset.s])};</script></body></html>
