<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ari-game-zone-icon.svg" type="image/svg+xml"><title>Games · Ari Game Zone</title><link rel="stylesheet" href="az.css"><link rel="stylesheet" href="v17.css"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="games"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>All Games</h1><input id="search" class="azinput" style="max-width:260px;letter-spacing:0;text-transform:none;text-align:left" placeholder="🔍 Search games..." autocomplete="off"></div><div class="cats" id="cats"></div><section class="games" id="games"></section><p id="empty" hidden>😕 No games found.</p></div><script src="az.js?v=17"></script><script src="nav.js"></script><script>
const CATS=['All','Shooter','Racing','Sports','Board','Cards','Puzzle','Arcade','Platformer','Fun','Online'],MODE={single:'🤖 Solo',local:'👥 2P',online:'🌐 Online'};let cat='All';
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),box=document.getElementById('games');box.innerHTML='';let n=0;
 Az.GAMES.forEach(g=>{if(cat==='Online'?!g.modes.includes('online'):(cat!=='All'&&g.cat!==cat))return;if(q&&!(g.name+' '+g.cat+' '+g.desc).toLowerCase().includes(q))return;n++;const lv=Az.level(g.id),a=document.createElement('a');a.className='card';a.dataset.cat=g.cat;a.href=g.file;
 a.innerHTML='<div class="emoji">'+g.emoji+'</div><h2>'+g.name+'</h2><div class="modes">'+g.modes.map(m=>'<span>'+MODE[m]+'</span>').join('')+'</div><div class="prog"><span>Level '+lv+' / '+g.max+'</span></div><div class="bar"><i style="width:'+Math.min(100,(lv-1)/(g.max-1||1)*100)+'%"></i></div>';box.appendChild(a)});document.getElementById('empty').hidden=n>0}
function cats(){document.getElementById('cats').innerHTML=CATS.map(x=>'<button class="azchip '+(x===cat?'on':'')+'" data-c="'+x+'">'+x+'</button>').join('')}
document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;cats();render()};document.getElementById('search').oninput=render;cats();render();document.addEventListener('az-account',render);</script></body></html>
