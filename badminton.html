<!doctype html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Badminton Rally · Ari Game Zone</title></head><body data-game="badminton"><main class="azgame"><div class="azhud"><span class="azpill" id="rally">Rally 0</span><span class="azpill" id="goal">Target 12</span><span class="azpill" id="hint">Ready</span></div><div class="azstage"><canvas id="cv" width="420" height="620" style="width:min(100%,420px)"></canvas><p class="azmsg">Tap HIT when the shuttle is near your side. Keep the rally going!</p></div><div class="azctl"><button class="azbtn" id="hit">🏸 HIT</button><button class="azbtn ghost" id="restart">🔄 Restart</button></div></main><script src="az.js?v=12"></script><script>
(()=>{const c=document.getElementById('cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);let L=1,rally=0,target=12,phase='incoming',sx=320,sy=230,vx=-190,vy=55,last=0,raf=0,dead=false,hitWindow=false;function reset(level){L=level;rally=0;target=12+Math.floor(L/3);phase='incoming';sx=320;sy=230;vx=-190-L*3;vy=55;dead=false;hitWindow=false;last=0;$('goal').textContent='Target '+target;$('rally').textContent='Rally 0';$('hint').textContent='Watch shuttle';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function finish(won){dead=true;cancelAnimationFrame(raf);Az.finish({game:'badminton',level:L,diff:'medium',won,base:won?24:8,score:rally,title:won?'Rally champion!':'Point lost',sub:'Rally score: '+rally+'.',next:n=>reset(n),retry:reset});}
function hit(){if(dead)return;if(phase==='incoming'&&sx<150&&sx>65){rally++;$('rally').textContent='Rally '+rally;phase='outgoing';vx=220+L*4;vy=-70-Math.random()*90;Az.sfx('hit');$('hint').textContent='Nice shot!';if(rally>=target){finish(true);return;}}else{$('hint').textContent='Too early / too late!';Az.sfx('pop');}}
function loop(ts){raf=requestAnimationFrame(loop);let dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;if(dead)return;sx+=vx*dt;sy+=vy*dt;if(phase==='incoming'&&sx<150&&sx>60)hitWindow=true;if(phase==='outgoing'&&sx>330){phase='incoming';sx=330;sy=180+Math.random()*140;vx=-(185+L*4);vy=(Math.random()-.5)*100;hitWindow=false;}$('hint').textContent=phase==='incoming'?(hitWindow?'HIT NOW!':'Get ready'):'Shuttle away';if(sx<35||sx>390||sy<70||sy>480){finish(false);return;}draw();}
function draw(){const g=x.createLinearGradient(0,0,0,620);g.addColorStop(0,'#063b4c');g.addColorStop(1,'#071a35');x.fillStyle=g;x.fillRect(0,0,420,620);x.strokeStyle='rgba(255,255,255,.65)';x.lineWidth=3;x.strokeRect(28,75,364,440);x.setLineDash([8,7]);x.beginPath();x.moveTo(210,75);x.lineTo(210,515);x.stroke();x.setLineDash([]);x.fillStyle='#ffcf6e';x.fillRect(0,515,420,5);x.font='56px sans-serif';x.fillText('🏸',72,475);x.fillText('🏸',345,125);x.font='24px sans-serif';x.fillText('🪶',sx-14,sy+8);x.fillStyle='#fff';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('PLAYER',85,550);x.fillText('OPPONENT',335,55);x.textAlign='left';}
$('hit').onclick=hit;$('restart').onclick=()=>reset(L);c.addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();hit();}});Az.start({game:'badminton',onStart:o=>reset(o.level)});})();</script></body></html>
