<!doctype html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Badminton Rally · Ari Game Zone</title><link rel="stylesheet" href="az.css"></head><body data-game="badminton"><main class="azgame"><div class="azpanel" style="width:100%;max-width:560px;padding:12px"><div class="azhud"><span class="azpill" id="rally">Your points 0</span><span class="azpill" id="goal">Target 12</span><span class="azpill" id="hint">Ready</span></div><div id="versus" class="sub" style="text-align:center;margin-top:8px">🏸 Solo challenge</div><div id="opponent" class="sub" style="text-align:center">Opponent: waiting</div></div><div class="azstage"><canvas id="cv" width="420" height="600" style="width:min(100%,420px)"></canvas><p class="azmsg" id="msg">Tap HIT when the shuttle enters the glowing zone. Build your highest rally!</p></div><div class="azctl"><button class="azbtn" id="hit">🏸 HIT</button><button class="azbtn ghost" id="restart">↻ Restart</button><button class="azbtn ghost" id="emoji">👏 React</button></div></main><script src="az.js?v=13"></script><script>
(()=>{const c=document.getElementById('cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);let L=1,points=0,target=12,phase='incoming',sx=340,sy=250,vx=-205,vy=35,last=0,raf=0,dead=false,net=null,opPoints=0,opName='Opponent',lastSend=0,streak=0;
function reset(level){L=level;points=0;target=12+Math.floor(L/3);phase='incoming';sx=340;sy=250;vx=-205-L*3;vy=40;dead=false;last=0;streak=0;$('goal').textContent='Target '+target;$('rally').textContent='Your points 0';$('hint').textContent='Watch shuttle';$('msg').textContent='Tap HIT as shuttle reaches your side.';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function hit(){if(dead)return;if(phase==='incoming'&&sx<155&&sx>65){points++;streak++;$('rally').textContent='Your points '+points;$('hint').textContent='Perfect return!';phase='outgoing';vx=235+L*3;vy=-65-Math.random()*110;Az.sfx('hit');if(net)net.send({__game:'badminton-score',score:points,name:Az.name()});if(points>=target){finish(true);return;}}else{$('hint').textContent='Wait for the shuttle zone';Az.sfx('pop');}}
function finish(won){if(dead)return;dead=true;cancelAnimationFrame(raf);if(net)net.send({__game:'badminton-finish',score:points,name:Az.name()});Az.finish({game:'badminton',level:L,diff:'medium',won,base:won?24:8,score:points,title:won?'Rally champion!':'Rally ended',sub:net?'Your points: '+points+' · '+opName+': '+opPoints:'You made '+points+' returns.',next:n=>reset(n),retry:reset});}
function loop(ts){raf=requestAnimationFrame(loop);let dt=Math.min(.035,(ts-(last||ts))/1000);last=ts;if(dead)return;sx+=vx*dt;sy+=vy*dt;if(phase==='outgoing'&&sx>355){phase='incoming';sx=355;sy=180+Math.random()*170;vx=-(195+L*4);vy=(Math.random()-.5)*130;}if(sx<35||sx>400||sy<55||sy>500){finish(false);return;}if(net&&ts-lastSend>300){lastSend=ts;net.send({__game:'badminton-live',score:points,name:Az.name()});}draw();}
function draw(){let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#123b55');g.addColorStop(1,'#0b1a34');x.fillStyle=g;x.fillRect(0,0,420,600);x.fillStyle='#1e805f';x.fillRect(25,65,370,455);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;x.strokeRect(25,65,370,455);x.setLineDash([8,7]);x.beginPath();x.moveTo(210,65);x.lineTo(210,520);x.stroke();x.setLineDash([]);x.strokeStyle='#ffcf6e';x.lineWidth=5;x.beginPath();x.moveTo(28,455);x.lineTo(392,455);x.stroke();x.fillStyle='rgba(255,255,255,.12)';x.fillRect(45,120,115,300);x.fillRect(260,120,115,300);x.font='52px sans-serif';x.textAlign='center';x.fillText('🏸',88,450);x.fillText('🏸',332,125);x.font='38px sans-serif';x.fillText('🪶',sx,sy);x.fillStyle='#fff';x.font='bold 17px system-ui';x.fillText('YOU',88,555);x.fillText('OPPONENT',332,45);x.fillStyle='#ffe08a';x.font='bold 14px system-ui';x.fillText('RETURN ZONE',100,405);}
$('hit').onclick=hit;$('restart').onclick=()=>reset(L);$('emoji').onclick=()=>{if(net)net.sendEmoji('👏');Az.toast('👏');};c.addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();hit();}});
Az.start({game:'badminton',onStart:o=>{net=o.net||null;if(net){$('versus').textContent='🌐 ONLINE RALLY CHALLENGE';$('opponent').textContent='Opponent: '+(net.peer?.name||'Connected');net.on(d=>{if(!d||!d.__game)return;if(d.__game==='badminton-score'||d.__game==='badminton-live'){opPoints=+d.score||0;opName=d.name||net.peer?.name||'Opponent';$('opponent').textContent=opName+': '+opPoints+' returns';}if(d.__game==='badminton-finish'){$('opponent').textContent=(d.name||opName)+' finished with '+(+d.score||0)+' returns';opPoints=+d.score||0;}});net.onclose(()=>{$('opponent').textContent='Opponent disconnected';});}else{$('versus').textContent='🏸 SOLO MODE';$('opponent').textContent='Beat your personal best';}reset(o.level);}});
})();</script></body></html>
