<!DOCTYPE html>
<html lang="en">
<head>
<script src="firebase-config.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0614">
<meta name="description" content="Ari Game Zone - 13 free games: battle royale, racing, chess, UNO, Level Devil, online multiplayer and more.">
<title>Ari Game Zone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:48px;display:grid;place-items:center}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<script>try{var t=JSON.parse(localStorage.getItem('az2')||'{}').theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
header{padding:30px 16px 8px;text-align:center}
.logo{font-size:12px;letter-spacing:4px;color:var(--a1);font-weight:700}
.hero h1{margin:10px 0;font-weight:900;font-size:clamp(30px,8vw,56px);letter-spacing:1px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px var(--blob2))}
.hero p{margin:0;color:var(--muted);font-size:14px}
main{width:min(1040px,100% - 24px);margin:14px auto 40px}
.me{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.me .l{display:flex;gap:12px;align-items:center;flex:1;min-width:220px}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--a1),var(--a2))}
.xp{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px;width:min(260px,60vw)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--a3),var(--a4));border-radius:99px;transition:width .6s}
.me .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coinbig{font-weight:800;color:var(--a4);font-size:18px}
.themes{display:flex;gap:8px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0;transition:transform .2s}
.dot[data-t=neon]{background:linear-gradient(135deg,#00e5ff,#ff3d9a)}.dot[data-t=sunset]{background:linear-gradient(135deg,#ff9f1c,#ff3b81)}.dot[data-t=ocean]{background:linear-gradient(135deg,#2dd4ff,#34f5b0)}.dot[data-t=forest]{background:linear-gradient(135deg,#7CFC8A,#ffd23f)}
.dot:hover{transform:scale(1.15)}.dot.on{border-color:#fff;box-shadow:0 0 0 3px var(--ring)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:170px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font-family:inherit;font-size:15px}
.search:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.cats .azchip{white-space:nowrap}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{--c:var(--a1);position:relative;overflow:hidden;display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px 14px;color:var(--text);min-height:200px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s,border-color .25s,box-shadow .25s;animation:azpop .5s backwards}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,var(--c),transparent 55%);opacity:.16;transition:opacity .25s}
.card>*{position:relative}
.card[data-cat=Shooter]{--c:var(--a2)}.card[data-cat=Racing]{--c:var(--a4)}.card[data-cat=Board]{--c:var(--a1)}.card[data-cat=Arcade]{--c:var(--a3)}.card[data-cat=Puzzle]{--c:#b388ff}.card[data-cat=Brain]{--c:#4dd0e1}.card[data-cat=Fun]{--c:#ff8a65}.card[data-cat=Platformer]{--c:#ff5252}.card[data-cat=Cards]{--c:#ffca28}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02);border-color:var(--c);box-shadow:0 16px 32px -12px var(--c);outline:none}.card:hover::before{opacity:.36}
.emoji{font-size:32px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .25s}
.card:hover .emoji{transform:rotate(-8deg) scale(1.12)}
.tag{margin-top:12px;font-size:10px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:1.5px}
.card h2{font-size:16px;margin:4px 0 4px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.modes{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.modes span{font-size:10px;padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.prog{margin-top:10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
</style>
</head>
<body>
<header><div class="logo">YOUR MINI GAMING WORLD</div><div class="hero"><h1>🎮 Ari Game Zone</h1><p>13 free games · up to 100 levels · Shop · Online multiplayer · Play on phone or computer</p></div></header>
<main>
  <div class="azpanel me">
    <div class="l"><div class="avatar" data-az="avatar">😎</div><div><b>Player Level <span data-az="plvl">1</span></b><div class="xp"><i id="xpbar" style="width:0%"></i></div><small id="xptxt" style="color:var(--muted)"></small><div style="margin-top:4px;font-size:12px;color:var(--muted)">👤 <b data-az="name" style="color:inherit"></b> · 🆔 <span data-az="uid"></span></div></div></div>
    <div class="r"><span class="coinbig">🪙 <span data-az="coins">0</span></span><button class="azbtn sm" id="daily">🎁 Daily bonus</button><button class="azbtn sm ghost" id="shopall">🛒 Shop</button><button class="azbtn sm ghost" id="profb">🆔 Profile</button><button class="azbtn sm ghost" id="admincoins">⚙️ My Coins</button><div class="themes" id="themes"></div></div>
  </div>
  <div class="toolbar"><input id="search" class="search" placeholder="🔍 Search games..." autocomplete="off"></div>
  <div class="cats" id="cats"></div>
  <section class="games" id="games"></section>
  <p class="empty" id="empty" hidden>😕 No games found. Try another search.</p>
</main>
<footer>Made with ❤️ using HTML, CSS and JavaScript · Ari Game Zone</footer>
<script src="az.js?v=6"></script>
<script>
const CATS=['All','Shooter','Racing','Board','Cards','Arcade','Platformer','Fun','Online'];
let cat='All';
const MODE={single:'🤖 Solo',local:'👥 2P',online:'🌐 Online'};
function render(){
  const q=document.getElementById('search').value.toLowerCase().trim(),box=document.getElementById('games');box.innerHTML='';let n=0;
  Az.GAMES.forEach((g,i)=>{
    if(cat==='Online'?!g.modes.includes('online'):(cat!=='All'&&g.cat!==cat))return;
    if(q&&!(g.name+' '+g.cat+' '+g.desc).toLowerCase().includes(q))return;
    n++;const lv=Az.level(g.id),a=document.createElement('a');a.className='card';a.dataset.cat=g.cat;a.href=g.file;a.style.animationDelay=(n*40)+'ms';
    a.innerHTML=`<div class="emoji">${g.emoji}</div><div class="tag">${g.cat}</div><h2>${g.name}</h2><p>${g.desc}</p><div class="modes">${g.modes.map(m=>`<span>${MODE[m]}</span>`).join('')}</div><div class="prog"><span>Level ${lv} / ${g.max}</span><span>${Az.place(lv).emoji}</span></div><div class="bar"><i style="width:${Math.min(100,(lv-1)/(g.max-1||1)*100)}%"></i></div>`;
    box.appendChild(a);
  });
  document.getElementById('empty').hidden=n>0;
}
function drawCats(){const c=document.getElementById('cats');c.innerHTML=CATS.map(x=>`<button class="azchip ${x===cat?'on':''}" data-c="${x}">${x==='Online'?'🌐 Online':x}</button>`).join('');}
document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;drawCats();render();};
document.getElementById('search').oninput=render;
function drawTop(){const p=Az.plProgress();document.getElementById('xpbar').style.width=Math.min(100,p.cur/p.need*100)+'%';document.getElementById('xptxt').textContent=p.cur+' / '+p.need+' XP to next level';Az.refresh();
  const today=new Date().toDateString();document.getElementById('daily').disabled=Az.get('daily')===today;document.getElementById('daily').textContent=Az.get('daily')===today?'✅ Claimed today':'🎁 Daily bonus';}
document.getElementById('daily').onclick=()=>{const t=new Date().toDateString();if(Az.get('daily')===t)return;Az.set('daily',t);Az.addCoins(Az.DAILY_BONUS);Az.sfx('coin');Az.toast('🎁 +'+Az.DAILY_BONUS+' coins! Come back tomorrow.');drawTop();};
document.getElementById('shopall').onclick=()=>Az.shop();
const th=document.getElementById('themes');['neon','sunset','ocean','forest'].forEach(t=>{const b=document.createElement('button');b.className='dot';b.dataset.t=t;b.title=t;b.setAttribute('aria-label',t+' theme');b.onclick=()=>{Az.setTheme(t);mark();};th.appendChild(b);});
function mark(){th.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.t===Az.get('theme')));}
document.addEventListener('az-ready',()=>{mark();drawTop();});
// login / logout / account switch: repaint level bars, coins, theme dot for the new account
document.addEventListener('az-account',()=>{mark();drawTop();render();});
drawCats();render();
// refresh when coming back from a game with the back button
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script>
</body>
</html>
