<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Math · Ari Game Zone</title><script src="firebase-config.js"></script><link rel="stylesheet" href="az.css?v=20"><style>
.qhud{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.qhud div{flex:1;padding:8px 4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.qhud small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.qbar{height:8px;border-radius:6px;background:var(--panel);overflow:hidden}.qbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.qq{font:900 clamp(34px,10vw,52px)/1.1 Orbitron,sans-serif;margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.3)}

</style></head><body data-game="quickmath"><main class="azgame"><section class="azpanel" style="width:100%;max-width:560px;text-align:center"><div class="azbig">➗</div><h1>Quick Math</h1><p class="sub">Correct +10 (streak bonus). Wrong −5 points and −3 seconds. Reach the goal before time runs out.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=22"></script><script>(()=>{
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let level=1,diff='medium',score=0,right=0,wrong=0,streak=0,left=60,total=60,tier=0,base=0,goal=100,cur=null,lock=false,tm=null,done=true,t0=0;
function makeQ(t){const ops=t<1?['+','−']:t<2?['+','−','×']:['+','−','×','÷'],op=ops[R(0,ops.length-1)],k=Math.min(4,t),mx=[10,20,40,60,99][k],m=[5,9,12,12,15][k];let a,b,r;
 if(op==='+'){a=R(1,mx);b=R(1,mx);r=a+b}else if(op==='−'){a=R(2,mx);b=R(1,a);r=a-b}else if(op==='×'){a=R(2,m);b=R(2,m);r=a*b}else{b=R(2,m);r=R(2,[9,12,15,20,25][k]);a=b*r}
 const set=new Set([r]),d=[1,2,3,10,-1,-2,-3,-10,5,-5];let n=0;while(set.size<4&&n++<80){const v=r+d[R(0,d.length-1)];if(v>=0)set.add(v)}let x=10;while(set.size<4)set.add(r+x++);
 return{text:a+' '+op+' '+b,ans:r,opts:[...set].sort(()=>Math.random()-.5)}}
function hud(){const acc=right+wrong?Math.round(right/(right+wrong)*100):100;$('h').innerHTML='<div><small>Time</small>'+Math.ceil(left)+'s</div><div><small>Score / Goal</small>'+score+' / '+goal+'</div><div><small>Streak</small>'+streak+'🔥</div><div><small>Accuracy</small>'+acc+'%</div>';$('tb').style.width=Math.max(0,left/total*100)+'%'}
function next(){tier=Math.min(4,base+Math.floor(right/4));cur=makeQ(tier);lock=false;$('q').textContent=cur.text+' = ?';$('o').innerHTML=cur.opts.map((v,i)=>'<button class="azchip" data-v="'+v+'">'+v+'</button>').join('');$('o').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b))}
function pick(b){if(lock||done)return;lock=true;const ok=+b.dataset.v===cur.ans;
 if(ok){right++;streak++;const p=10+Math.min(10,(streak-1)*2);score+=p;left=Math.min(99,left+1);b.classList.add('ok');$('f').style.color='var(--a3)';$('f').textContent='Correct! +'+p}
 else{wrong++;streak=0;score=Math.max(0,score-5);left-=3;b.classList.add('no');$('o').querySelectorAll('button').forEach(x=>{if(+x.dataset.v===cur.ans)x.classList.add('ok')});$('f').style.color='var(--bad)';$('f').textContent='Wrong! −5 points, −3 seconds. Answer: '+cur.ans}
 hud();setTimeout(()=>{if(!done)next()},ok?350:900)}
function tick(){if(done)return;const now=performance.now();left-=(now-t0)/1000;t0=now;if(left<=0){left=0;hud();end()}else hud()}
function end(){if(done)return;done=true;clearInterval(tm);const acc=right+wrong?Math.round(right/(right+wrong)*100):0,won=score>=goal;
 Az.finish({game:'quickmath',level,diff,won,base:35,score,title:won?'Goal reached!':'Time up!',sub:'Score '+score+' / goal '+goal+' · Correct '+right+' · Wrong '+wrong+' · Accuracy '+acc+'%',progress:true,retry:()=>location.reload()})}
function begin(o){o=o||{};level=o.level||1;diff=o.diff||'medium';score=right=wrong=streak=0;base=Math.min(2,Math.floor((level-1)/15))+(diff==='hard'?1:0);total=left=diff==='easy'?70:diff==='hard'?50:60;goal=80+Math.min(level,50)*2;done=false;
 $('gamearea').innerHTML='<div class="qbar"><i id="tb"></i></div><div class="qhud" id="h"></div><div class="qq" id="q"></div><div class="qo" id="o"></div><p class="qf" id="f"></p>';$('start').hidden=true;$('status').textContent='';hud();next();t0=performance.now();clearInterval(tm);tm=setInterval(tick,100)}
$('start').onclick=()=>Az.start({game:'quickmath',onStart:begin});
addEventListener('keydown',e=>{const i=+e.key-1;if(i>=0&&i<4&&!done){const b=$('o').querySelectorAll('button')[i];b&&pick(b)}});
window.__qm={makeQ,begin,end,get S(){return{score,right,wrong,left,goal,done}},setLeft:v=>{left=v}};
})();</script></body></html>
