<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Math · Ari Game Zone</title><link rel="stylesheet" href="az.css"></head><body data-game="quickmath"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">➗</div><h1>Quick Math</h1><p class="sub">Solve 10 arithmetic questions.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=15"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false;function finish(won,sub){if(done)return;done=true;Az.finish({game:'quickmath',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}function start(){Az.start({game:'quickmath',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;run()}})}$('start').onclick=start;let answer=0,round=0,timer=null;function run(){round=0;score=0;next()}function next(){if(round>=10){finish(score>=6,'Correct answers: '+score+'/10');return}round++;let a=Math.floor(Math.random()*(10+level*2))+1,b=Math.floor(Math.random()*12)+1,op=level<5?'+':['+','−','×'][Math.floor(Math.random()*3)];answer=op==='+'?a+b:op==='−'?a-b:a*b;$('gamearea').innerHTML='<h2>'+a+' '+op+' '+b+' = ?</h2><div class="azrow c">'+[answer,answer+2,answer-1,answer+4].sort(()=>Math.random()-.5).map(v=>'<button class="azchip" data-v="'+v+'">'+v+'</button>').join('')+'</div><small>Question '+round+' of 10</small>';$('gamearea').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.v===answer)score++;next()})}})();</script></body></html>
