<!doctype html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Runner · Ari Game Zone</title></head><body data-game="runner"><main class="azgame"><div class="azhud"><span class="azpill" id="score">Score 0</span><span class="azpill" id="target">Target —</span><span class="azpill" id="speed">Speed 1x</span></div><div class="azstage"><canvas id="cv" width="420" height="620" style="width:min(100%,420px)"></canvas><p class="azmsg">Tap JUMP or press Space / ↑ to jump. Avoid the neon blocks!</p></div><div class="azctl"><button class="azbtn" id="jump">⬆️ JUMP</button><button class="azbtn ghost" id="restart">🔄 Restart</button></div></main><script src="az.js?v=12"></script><script>
(()=>{const c=document.getElementById('cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);let L=1,score=0,playerY=0,vy=0,obs=[],coins=[],t=0,last=0,raf=0,dead=false,started=false,speed=250,target=600;const ground=535;
function reset(level){L=level;score=0;playerY=ground;vy=0;obs=[];coins=[];t=0;last=0;dead=false;started=true;speed=250+L*8;target=600+L*90;for(let i=0;i<3;i++)obs.push({x:500+i*260,w:28+Math.random()*24,h:36+Math.random()*42});$('target').textContent='Target '+target;$('score').textContent='Score 0';$('speed').textContent='Speed '+(speed/250).toFixed(1)+'x';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function jump(){if(!started||dead)return;if(playerY>=ground-1){vy=-650;Az.sfx('jump');}}
function fail(){dead=true;Az.finish({game:'runner',level:L,diff:'medium',won:false,base:14,score:Math.floor(score),title:'Run ended',sub:'You scored '+Math.floor(score)+' points.',retry:reset});}
function loop(ts){raf=requestAnimationFrame(loop);let dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;if(dead)return;t+=dt;score+=dt*speed*.12;const s=speed+L*2;vy+=1500*dt;playerY=Math.min(ground,playerY+vy*dt);obs.forEach(o=>o.x-=s*dt);if(obs[obs.length-1].x<250)obs.push({x:480+Math.random()*180,w:26+Math.random()*26,h:35+Math.random()*65});obs=obs.filter(o=>o.x>-60);for(const o of obs){if(o.x<100&&o.x+o.w>55&&playerY>ground-o.h-26){fail();return;}}if(score>=target){dead=true;cancelAnimationFrame(raf);Az.finish({game:'runner',level:L,diff:'medium',won:true,base:22,score:Math.floor(score),title:'Stage cleared!',sub:'Great run! Next stage is faster.',next:n=>reset(n),retry:reset});return;}
$('score').textContent='Score '+Math.floor(score);$('speed').textContent='Speed '+(s/250).toFixed(1)+'x';draw();}
function draw(){const g=x.createLinearGradient(0,0,0,620);g.addColorStop(0,'#101a46');g.addColorStop(1,'#260d3d');x.fillStyle=g;x.fillRect(0,0,420,620);x.fillStyle='rgba(0,229,255,.12)';for(let i=0;i<9;i++)x.fillRect((i*64-t*speed*.2%64),0,1,535);x.fillStyle='#191d3e';x.fillRect(0,ground,420,85);x.fillStyle='#00e5ff';x.fillRect(0,ground,420,4);obs.forEach(o=>{x.shadowBlur=15;x.shadowColor='#ff3d9a';x.fillStyle='#ff3d9a';x.fillRect(o.x,ground-o.h,o.w,o.h);x.shadowBlur=0;});x.font='42px sans-serif';x.textAlign='center';x.fillText('🏃',78,playerY-4);x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText('LEVEL '+L,210,42);}
$('jump').onclick=jump;$('restart').onclick=()=>reset(L);c.addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump();}});Az.start({game:'runner',onStart:o=>reset(o.level)});})();</script></body></html>
