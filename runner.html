<!doctype html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Runner · Ari Game Zone</title><link rel="stylesheet" href="az.css"></head><body data-game="runner"><main class="azgame"><div class="azpanel" style="width:100%;max-width:560px;padding:12px"><div class="azhud"><span class="azpill" id="score">Distance 0</span><span class="azpill" id="target">Target 600</span><span class="azpill" id="speed">Speed 1x</span></div><div id="versus" class="sub" style="text-align:center;margin-top:8px">🏃 Solo run</div><div id="opponent" class="sub" style="text-align:center">Opponent: waiting</div></div><div class="azstage"><canvas id="cv" width="420" height="600" style="width:min(100%,420px)"></canvas><p class="azmsg" id="msg">Tap JUMP or press Space / ↑. Avoid the barriers and reach the distance target!</p></div><div class="azctl"><button class="azbtn" id="jump">⬆️ JUMP</button><button class="azbtn ghost" id="restart">↻ Restart</button><button class="azbtn ghost" id="emoji">😎 React</button></div></main><script src="az.js?v=13"></script><script>
(()=>{const c=document.getElementById('cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);let L=1,score=0,y=490,vy=0,obs=[],t=0,last=0,raf=0,dead=false,started=false,speed=245,target=600,net=null,host=true,opScore=0,opName='Opponent',lastSend=0,finishSent=false;
function reset(level){L=level;score=0;y=490;vy=0;t=0;last=0;dead=false;started=true;finishSent=false;speed=245+L*7;target=600+L*70;obs=[];for(let i=0;i<4;i++)obs.push({x:480+i*300,w:25+Math.random()*22,h:34+Math.random()*55});$('target').textContent='Target '+target;$('score').textContent='Distance 0';$('speed').textContent='Speed 1x';$('msg').textContent='Run! Jump over the glowing barriers.';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function jump(){if(!started||dead)return;if(y>=489){vy=-650;Az.sfx('jump');}}
function finish(won){if(dead)return;dead=true;cancelAnimationFrame(raf);if(net){net.send({__game:'runner-finish',score:Math.floor(score),name:Az.name()});$('msg').textContent='Finish recorded. Opponent score: '+opScore;}Az.finish({game:'runner',level:L,diff:'medium',won,base:won?22:8,score:Math.floor(score),title:won?'Distance cleared!':'Run complete',sub:net?'Your distance: '+Math.floor(score)+' · '+opName+': '+opScore:'You reached '+Math.floor(score)+' distance.',retry:reset});}
function loop(ts){raf=requestAnimationFrame(loop);let dt=Math.min(.035,(ts-(last||ts))/1000);last=ts;if(dead)return;t+=dt;score+=dt*speed*.45;let s=speed+L*2;vy+=1600*dt;y=Math.min(490,y+vy*dt);obs.forEach(o=>o.x-=s*dt);if(obs[obs.length-1].x<250)obs.push({x:500+Math.random()*150,w:25+Math.random()*22,h:34+Math.random()*65});obs=obs.filter(o=>o.x>-60);for(const o of obs){if(o.x<112&&o.x+o.w>58&&y>490-o.h-27){finish(false);return;}}if(score>=target){score=target;finish(true);return;}$('score').textContent='Distance '+Math.floor(score);$('speed').textContent='Speed '+(s/245).toFixed(1)+'x';if(net&&ts-lastSend>250){lastSend=ts;net.send({__game:'runner-score',score:Math.floor(score),name:Az.name()});}draw();}
function draw(){let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#14234b');g.addColorStop(1,'#10152c');x.fillStyle=g;x.fillRect(0,0,420,600);for(let i=0;i<40;i++){x.fillStyle='rgba(180,220,255,.5)';x.fillRect((i*97-t*16)%420,(i*47)%400,2,2);}x.fillStyle='#1d2c48';x.fillRect(0,490,420,110);x.fillStyle='#60e8ff';x.fillRect(0,490,420,4);obs.forEach(o=>{x.shadowBlur=16;x.shadowColor='#ff5d9e';x.fillStyle='#ff5d9e';x.fillRect(o.x,490-o.h,o.w,o.h);x.shadowBlur=0;});x.font='46px sans-serif';x.textAlign='center';x.fillText('🏃',85,y);x.fillStyle='#fff';x.font='bold 17px system-ui';x.fillText('LEVEL '+L,210,38);x.font='12px system-ui';x.fillStyle='#a9c8ed';x.fillText('YOUR LANE',210,570);}
$('jump').onclick=jump;$('restart').onclick=()=>reset(L);$('emoji').onclick=()=>{if(net)net.sendEmoji('😎');Az.toast('😎');};c.addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump();}});
Az.start({game:'runner',onStart:o=>{net=o.net||null;host=!!o.host;if(net){$('versus').textContent='🌐 ONLINE RACE · Room connected';$('opponent').textContent='Opponent: '+(net.peer?.name||'Connected');net.on(d=>{if(!d||!d.__game)return;if(d.__game==='runner-score'){opScore=+d.score||0;opName=d.name||net.peer?.name||'Opponent';$('opponent').textContent=opName+': '+opScore+' m';}if(d.__game==='runner-finish'){$('opponent').textContent=(d.name||opName)+' finished: '+(+d.score||0)+' m';opScore=+d.score||0;}});net.onclose(()=>{$('opponent').textContent='Opponent disconnected';});}else{$('versus').textContent='🏃 SOLO MODE';$('opponent').textContent='Beat your own best distance';}reset(o.level);}});
})();</script></body></html>
