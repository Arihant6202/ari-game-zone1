<!doctype html><html lang="en"><head>
    <meta name="description" content="Play Tap Rush at Ari Game Zone. Test your speed and accuracy in this quick tapping challenge, free to play in your browser."><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tap Rush – Free Reflex Game | Ari Game Zone</title><link rel="stylesheet" href="az.css?v=1.04.00">    <link rel="canonical" href="https://arihant6202.github.io/ari-game-zone1/tap-rush.html">
</head><body data-game="taprush"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">⚡</div><h1>Tap Rush</h1><p class="sub">Chase the moving target for 15 seconds. Misses cost you!</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=1.07.00"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false,running=false;
function finish(won,sub){if(done)return;done=true;running=false;$('start').style.display='';Az.finish({game:'taprush',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}
function start(){if(running)return;Az.start({game:'taprush',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;running=true;$('start').style.display='none';run()}})}
$('start').onclick=start;

let hits=0,miss=0,remaining=15,timer=0,goal=15,tsize=84;
function run(){clearInterval(timer);hits=0;miss=0;remaining=15;goal=Math.round((10+level*.25)*(diff==='hard'?1.5:diff==='easy'?.7:1));tsize=Math.max(46,Math.round(88-level*.4-(diff==='hard'?12:0)));
 $('gamearea').innerHTML='<p>⏱ <b id="clock">15</b>s · Hits <b id="hits">0</b> / goal <b>'+goal+'</b> · Misses <b id="miss">0</b></p><div id="arena" style="position:relative;height:300px;border-radius:16px;border:1px solid var(--line);background:#ffffff0a;overflow:hidden;touch-action:manipulation"></div>';
 const ar=$('arena');
 const place=()=>{let t=$('target');if(!t){t=document.createElement('button');t.id='target';t.className='azbtn';t.textContent='⚡';t.style.cssText='position:absolute;border-radius:50%;padding:0;width:'+tsize+'px;height:'+tsize+'px;font-size:'+Math.round(tsize*.45)+'px;min-width:0';ar.appendChild(t);t.onpointerdown=e=>{e.stopPropagation();if(remaining<=0||done)return;hits++;$('hits').textContent=hits;Az.sfx('pop');place()}}
  t.style.left=Math.random()*(ar.clientWidth-tsize)+'px';t.style.top=Math.random()*(ar.clientHeight-tsize)+'px'};
 ar.onpointerdown=()=>{if(remaining<=0||done)return;miss++;$('miss').textContent=miss};
 place();
 timer=setInterval(()=>{remaining--;$('clock').textContent=remaining;if(remaining<=0){clearInterval(timer);const net=Math.max(0,hits-Math.floor(miss/2));score=net;finish(net>=goal,'You hit '+hits+' targets ('+miss+' misses). Goal: '+goal+'.')}},1000)}
})();</script></body></html>
