<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tap Rush · Ari Game Zone</title><link rel="stylesheet" href="az.css"></head><body data-game="taprush"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">⚡</div><h1>Tap Rush</h1><p class="sub">Hit as many targets as you can in 15 seconds.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=15"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false;function finish(won,sub){if(done)return;done=true;Az.finish({game:'taprush',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}function start(){Az.start({game:'taprush',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;run()}})}$('start').onclick=start;let hits=0,remaining=15,timer;function run(){hits=0;remaining=15;$('gamearea').innerHTML='<h2 id="clock">15</h2><button id="target" class="azbtn" style="font-size:30px;padding:32px">⚡ TAP!</button><p>Targets hit: <b id="hits">0</b></p>';$('target').onclick=()=>{if(remaining<=0)return;hits++;$('hits').textContent=hits;$('target').style.transform='scale(.94)';setTimeout(()=>$('target').style.transform='',80)};timer=setInterval(()=>{remaining--;$('clock').textContent=remaining;if(remaining<=0){clearInterval(timer);score=hits;finish(hits>=15,'You hit '+hits+' targets in 15 seconds.')}},1000)}})();</script></body></html>
