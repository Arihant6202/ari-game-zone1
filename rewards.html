<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:image" content="./share-image.png?v=20"><title>Rewards · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=20"><link rel="stylesheet" href="v17.css?v=20"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="rewards"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>🎁 Rewards</h1><span class="azpill coin">🪙 <b data-az="coins">0</b> Gold</span></div><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">Daily bonus</h2><button class="azbtn" id="daily">🎁 Daily bonus</button></section><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">🎡 Lucky Reward</h2><small style="color:var(--muted)" id="spinnote">Random item or Gold · every spin costs 100 more</small><br><button class="azbtn" id="spin" style="margin-top:8px">🎁 Spin now</button><p id="res" style="color:var(--a3);font-weight:700"></p></section></div><script src="az.js?v=21"></script><script src="nav.js"></script><script>
function dailyUI(){const t=new Date().toDateString(),d=document.getElementById('daily'),c=Az.get('daily')===t;d.disabled=c;d.textContent=c?'✅ Claimed today':'🎁 Daily bonus'}
document.getElementById('daily').onclick=()=>{const t=new Date().toDateString();if(Az.get('daily')===t)return;Az.set('daily',t);Az.addCoins(Az.DAILY_BONUS);Az.sfx('coin');Az.toast('🎁 +'+Az.DAILY_BONUS+' Gold! Come back tomorrow.');dailyUI();Az.refresh()};
function spinUI(){const c=Az.spinCost();document.getElementById('spin').textContent='🎡 Spin now · '+c+' Gold';document.getElementById('spinnote').textContent='Next spin: '+c+' Gold · price goes up by 100 after every spin (max 10000)'}
document.getElementById('spin').onclick=()=>{Az.spinPlay(r=>{document.getElementById('res').textContent=r?'🎉 Last win: '+r.name:'';spinUI()})};
spinUI();document.addEventListener('az-account',spinUI);
dailyUI();document.addEventListener('az-account',()=>{dailyUI()});</script></body></html>
