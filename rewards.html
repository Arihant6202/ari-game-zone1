<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ari-game-zone-icon.svg" type="image/svg+xml"><title>Rewards · Ari Game Zone</title><link rel="stylesheet" href="az.css"><link rel="stylesheet" href="v17.css"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="rewards"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>🎁 Rewards</h1><span class="azpill coin">🪙 <b data-az="coins">0</b> Gold</span></div><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">Daily bonus</h2><button class="azbtn" id="daily">🎁 Daily bonus</button></section><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">🎡 Lucky Reward</h2><small style="color:var(--muted)">Cost: 100 Gold · random item or Gold</small><br><button class="azbtn" id="spin" style="margin-top:8px">🎁 Spin now</button><p id="res" style="color:var(--a3);font-weight:700"></p></section><section class="azpanel"><h2 style="margin:0 0 6px">Next level rewards</h2><p style="color:var(--muted);font-size:12px">+100 Gold every level. Every 5th level gives a special item.</p><div class="grid2" id="rp"></div></section></div><script src="az.js?v=17"></script><script src="nav.js"></script><script>
function dailyUI(){const t=new Date().toDateString(),d=document.getElementById('daily'),c=Az.get('daily')===t;d.disabled=c;d.textContent=c?'✅ Claimed today':'🎁 Daily bonus'}
document.getElementById('daily').onclick=()=>{const t=new Date().toDateString();if(Az.get('daily')===t)return;Az.set('daily',t);Az.addCoins(Az.DAILY_BONUS);Az.sfx('coin');Az.toast('🎁 +'+Az.DAILY_BONUS+' Gold! Come back tomorrow.');dailyUI();Az.refresh()};
document.getElementById('spin').onclick=()=>{const r=Az.luckySpin();document.getElementById('res').textContent=r?'🎉 You won: '+r.name:'You need 100 Gold to spin.'};
function rp(){document.getElementById('rp').innerHTML=Az.rewardPreview(Az.plvl(),8).map(r=>'<div class="tile"><b style="font-size:18px">Level '+r.level+'</b>+100 🪙'+(r.item?'<br><span style="color:'+Az.rarity(r.item).c+'">'+Az.SHOP[r.item.slot].emoji+' '+r.item.name+'</span>':'')+'</div>').join('')}
dailyUI();rp();document.addEventListener('az-account',()=>{dailyUI();rp()});</script></body></html>
