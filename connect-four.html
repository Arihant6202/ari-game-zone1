<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:78px;display:grid;place-items:center}
.azitem .fig{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.azitem .fig svg{max-width:100%}
.azitem.eq .fig{box-shadow:inset 0 0 0 1px var(--a3)}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<style>
.c4wrap{width:min(100%,460px);display:flex;flex-direction:column;gap:10px;align-items:center}
#cv{width:100%;height:auto;aspect-ratio:440/450;cursor:pointer;transition:box-shadow .4s}
.c4who{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.c4who .azpill{display:flex;align-items:center;gap:6px;transition:all .25s}
.c4who .azpill.turn{border-color:var(--a1);box-shadow:0 0 16px -4px var(--a1);transform:scale(1.06)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%}
.dot.r{background:radial-gradient(circle at 35% 30%,#ff9aae,#ff2d55 60%,#b3002b)}
.dot.y{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffd23f 60%,#c79500)}
.azmsg.shake{animation:c4sh .35s}
@keyframes c4sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>

<body data-game="c4">
<main class="azgame">
  <div class="azhud"><span class="azpill" id="hInfo">🧠 …</span><span class="azpill" id="hMoves">Moves 0</span></div>
  <div class="azstage c4wrap">
    <div class="c4who"><span class="azpill" id="pR"><i class="dot r"></i><span id="nR">Red</span></span><span class="azpill" id="pY"><i class="dot y"></i><span id="nY">Yellow</span></span></div>
    <canvas id="cv" width="440" height="450"></canvas>
  </div>
  <div class="azmsg" id="msg">&nbsp;</div>
  <div class="azctl"><button class="azbtn ghost" id="restart">🔄 Restart</button></div>
</main>
<script src="az.js?v=7"></script>
<script>
'use strict';
/* ---------------- AI search (self-contained so it can run inside a Web Worker) ---------------- */
function c4search(cells, me, maxDepth, ms, order) {
  const b = cells.slice(), h = [0, 0, 0, 0, 0, 0, 0];
  let filled = 0;
  for (let c = 0; c < 7; c++) for (let r = 0; r < 6; r++) if (b[r * 7 + c]) { h[c]++; filled++; }
  const wins = [], D = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) for (const [dr, dc] of D) {
    const er = r + dr * 3, ec = c + dc * 3; if (er < 0 || er > 5 || ec < 0 || ec > 6) continue;
    const w = []; for (let k = 0; k < 4; k++) w.push((r + dr * k) * 7 + c + dc * k); wins.push(w);
  }
  const t0 = Date.now(); let nodes = 0, stop = false;
  function win(idx, p) {
    const r = (idx / 7) | 0, c = idx % 7;
    for (const [dr, dc] of D) {
      let n = 1;
      for (let k = 1; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr > 5 || cc < 0 || cc > 6 || b[rr * 7 + cc] !== p) break; n++; }
      for (let k = 1; k < 4; k++) { const rr = r - dr * k, cc = c - dc * k; if (rr < 0 || rr > 5 || cc < 0 || cc > 6 || b[rr * 7 + cc] !== p) break; n++; }
      if (n >= 4) return true;
    }
    return false;
  }
  function evalp(p) {
    let s = 0;
    for (let i = 0; i < wins.length; i++) {
      const w = wins[i]; let a = 0, o = 0;
      for (let k = 0; k < 4; k++) { const v = b[w[k]]; if (v === p) a++; else if (v) o++; }
      if (!o) { if (a === 3) s += 6; else if (a === 2) s += 2; }
      else if (!a) { if (o === 3) s -= 5; else if (o === 2) s -= 2; }
    }
    for (let r = 0; r < 6; r++) {
      const m = b[r * 7 + 3]; if (m) s += m === p ? 3 : -3;
      const l = b[r * 7 + 2], q = b[r * 7 + 4]; if (l) s += l === p ? 1 : -1; if (q) s += q === p ? 1 : -1;
    }
    return s;
  }
  function child(c, p, d, alpha, beta) {
    const idx = (5 - h[c]) * 7 + c; b[idx] = p; h[c]++; filled++;
    let sc;
    if (win(idx, p)) sc = 100000 + d; else if (filled === 42) sc = 0; else if (d <= 1) sc = evalp(p); else sc = -nega(3 - p, d - 1, -beta, -alpha);
    b[idx] = 0; h[c]--; filled--;
    return sc;
  }
  function nega(p, d, alpha, beta) {
    if (stop) return 0;
    if ((++nodes & 1023) === 0 && Date.now() - t0 > ms) { stop = true; return 0; }
    let best = -1e9, any = false;
    for (let i = 0; i < 7; i++) {
      const c = order[i]; if (h[c] >= 6) continue; any = true;
      const sc = child(c, p, d, alpha, beta);
      if (stop) return 0;
      if (sc > best) best = sc; if (best > alpha) alpha = best; if (alpha >= beta) break;
    }
    return any ? best : 0;
  }
  let bestCol = -1, bestScore = 0, done = 0;
  for (let d = 1; d <= maxDepth; d++) {
    let alpha = -1e9, cur = -1, curS = -1e9;
    for (let i = 0; i < 7; i++) {
      const c = order[i]; if (h[c] >= 6) continue;
      const sc = child(c, me, d, alpha, 1e9);
      if (stop) break;
      if (sc > curS) { curS = sc; cur = c; } if (curS > alpha) alpha = curS;
    }
    if (stop) { if (bestCol < 0) bestCol = cur; break; }
    bestCol = cur; bestScore = curS; done = d;
    if (curS >= 100000 || curS <= -100000) break;
  }
  if (bestCol < 0) for (let c = 0; c < 7; c++) if (h[c] < 6) { bestCol = c; break; }
  return { col: bestCol, score: bestScore, depth: done };
}
let worker = null;
try {
  const src = 'onmessage=function(e){var d=e.data;postMessage((' + c4search.toString() + ')(d.cells,d.me,d.depth,d.ms,d.order))}';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
} catch (e) { worker = null; }
function think(cells, me, depth, ms) {
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const order = [3].concat(sh([2, 4]), sh([1, 5]), sh([0, 6]));
  return new Promise(res => {
    const sync = () => setTimeout(() => res(c4search(cells, me, depth, ms, order)), 20);
    if (!worker) return sync();
    let fin = false;
    const to = setTimeout(() => { if (!fin) { fin = true; worker = null; sync(); } }, ms + 2500);
    worker.onmessage = e => { if (fin) return; fin = true; clearTimeout(to); res(e.data); };
    worker.onerror = () => { if (fin) return; fin = true; clearTimeout(to); worker = null; sync(); };
    worker.postMessage({ cells, me, depth, ms, order });
  });
}

/* ---------------- game ---------------- */
const COLS = 7, ROWS = 6, CELL = 60, PAD = 10, TOP = 70, W = 440, H = 450;
const RED = 1, YEL = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let O = null, grid, turn, over, busy, hover = -1, anims = [], winCells = null, moves = 0, token = 0, gameNo = 0;
let myColor = RED, aiColor = YEL, place = Az.place(1), pal = {}, inbox = [], thinking = false, shownEnd = false;
let myRq = false, oppRq = false;
const net = () => O && O.net;

function mix(h1, h2, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const a = p(h1), b = p(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function setPlace(level) {
  place = Az.place(level);
  pal = { frame: mix(place.ground, '#000000', .38), frame2: mix(place.ground, '#000000', .6), back0: mix(place.sky[0], '#000000', .5), back1: mix(place.sky[1], '#000000', .55), acc: place.accent };
  cv.style.boxShadow = '0 0 0 1px var(--line),0 0 40px -10px ' + place.accent;
}

Az.start({ game: 'c4', onStart });
window.__azStart = onStart;

function onStart(o) {
  O = o;
  if (o.mode === 'online') {
    myColor = o.host ? RED : YEL; aiColor = 0;
    $('restart').hidden = true;
    net().on(onNet); net().onclose(onGone);
  } else if (o.mode === 'single') { aiColor = (o.diff === 'hard') ? RED : YEL; myColor = 3 - aiColor; }
  else { myColor = 0; aiColor = 0; }
  begin(o.level || 1);
}
function begin(level) {
  O.level = level; gameNo = O.mode === 'single' ? 0 : gameNo;
  setPlace(O.mode === 'single' ? level : Math.max(1, Math.floor(Math.random() * 40)));
  if (O.mode === 'single') Az.setBadge('Lv ' + level + ' · ' + place.emoji + ' ' + place.name);
  else Az.setBadge(O.mode === 'local' ? '👥 2 Players · ' + place.emoji : '🌐 Online · ' + place.emoji);
  newGame();
}
function aiParams() {
  const L = O.level, d = O.diff;
  let depth = 1 + Math.round((L - 1) * 7 / 49) + Az.pick(d, -1, 0, 1);
  depth = Math.max(1, Math.min(9, depth));
  let mist = Math.max(0, .55 * (1 - (L - 1) / 38)) * Az.pick(d, 1.4, 1, .35) + Az.pick(d, .07, 0, 0);
  const ms = 120 + L * 16 + Az.pick(d, 0, 100, 250);
  return { depth, mist: Math.min(.8, mist), ms };
}
function newGame() {
  token++; grid = new Array(42).fill(0); over = false; busy = false; anims = []; winCells = null; moves = 0; inbox = []; thinking = false; shownEnd = false;
  turn = (O.mode === 'single') ? RED : ((gameNo % 2 === 0) ? RED : YEL);
  hover = -1; setMsg('');
  if (O.mode === 'single') { const p = aiParams(); $('hInfo').textContent = '🧠 AI depth ' + p.depth + (p.mist > .02 ? ' · slips ' + Math.round(p.mist * 100) + '%' : ' · no slips'); }
  else $('hInfo').textContent = O.mode === 'local' ? '👥 Pass & play' : (O.host ? '🌐 You host (red)' : '🌐 You joined (yellow)');
  const nm = { r: 'Red', y: 'Yellow' };
  if (O.mode === 'single') { nm[myColor === RED ? 'r' : 'y'] = 'You'; nm[aiColor === RED ? 'r' : 'y'] = '🤖 AI'; }
  if (O.mode === 'online') { nm[myColor === RED ? 'r' : 'y'] = 'You'; nm[aiColor || myColor === RED ? 'y' : 'r'] = 'Friend'; nm[myColor === RED ? 'y' : 'r'] = 'Friend'; }
  $('nR').textContent = nm.r; $('nY').textContent = nm.y;
  updHud();
  afterTurnStart();
}
function setMsg(t, shake) { const m = $('msg'); m.innerHTML = t || '&nbsp;'; m.classList.remove('shake'); if (shake) { void m.offsetWidth; m.classList.add('shake'); } }
function updHud() {
  $('hMoves').textContent = 'Moves ' + moves;
  $('pR').classList.toggle('turn', !over && turn === RED); $('pY').classList.toggle('turn', !over && turn === YEL);
  if (over) return;
  if (O.mode === 'local') setMsg((turn === RED ? '🔴 Red' : '🟡 Yellow') + ', your move');

const canPlay = () => !over && !busy && !thinking && (O.mode === 'local' || turn === myColor);

  if (over) return;

  else pump();
}
function aiMove() {
  const tok = token, p = aiParams(); thinking = true; updHud();

    const wait = Math.max(0, 450 - (Date.now() - t0));
    setTimeout(() => {
      if (tok !== token) return;
      thinking = false;
      let col = r.col;
      const legal = []; for (let c = 0; c < 7; c++) if (grid[c] === 0) legal.push(c);

}
function lowest(c) { for (let r = 5; r >= 0; r--) if (!grid[r * 7 + c]) return r; return -1; }

function play(c, color) {

  busy = true; thinking = false;
  if (net() && color === myColor && O.mode === 'online') net().send({ t: 'm', c });

function landed(a) {

function winText(col) {

function findWin(r, c, col) {

      retry: () => { gameNo++; newGame(); } });

    const won = winner === myColor;
    Az.finish({ game: 'c4', level: 1, diff: O.diff, won, progress: false, base: 30, title: draw ? 'Draw!' : won ? 'You Win!' : 'Your friend wins', sub: draw ? 'A perfectly even match.' : won ? 'Four in a row, nicely done!' : 'So close! Ask for a rematch.',

/* ---- online ---- */
function onNet(m) {
  if (!m) return;
  if (m.t === 'm') { inbox.push(m.c); pump(); }
  else if (m.t === 'rq') { oppRq = true; Az.toast('🔁 Your friend wants a rematch'); tryRematch(); }
  else if (m.t === 'go') { gameNo = m.n; myRq = oppRq = false; newGame(); }
}
function pump() {
  if (O.mode !== 'online') return;
  while (inbox.length && !over && !busy && turn !== myColor) {

    if (typeof c === 'number' && c >= 0 && c < 7 && lowest(c) >= 0) { play(c, turn); return; }

}
function rematch() { myRq = true; net().send({ t: 'rq' }); setMsg('🔁 Waiting for your friend to accept the rematch…'); tryRematch(); }
function tryRematch() {

}
function onGone() {

  setMsg('👋 Your friend left the game.');
  const m = Az.modal('<div class="azbig">👋</div><h2 style="text-align:center">Your friend left</h2><p class="sub" style="text-align:center">The connection was closed. You can start a new game any time.</p><div class="azrow c"><button class="azbtn" id="gl">⚙️ New game</button><a class="azbtn ghost" href="' + Az.BASE + 'index.html">🏠 Home</a></div>', { sticky: true });
  m.addEventListener('click', e => { if (e.target.id === 'gl') location.reload(); });
}

/* ---- input ---- */
function colFrom(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width;
  return Math.max(0, Math.min(6, Math.floor((x - PAD) / CELL)));
}
cv.addEventListener('pointermove', e => { if (O) hover = colFrom(e); });

cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = -1; });

function tryDrop(c) {

  play(c, O.mode === 'local' ? turn : myColor);
}
document.addEventListener('keydown', e => {
  if (!O || document.querySelector('.azmodal')) return;
  if (e.key === 'ArrowLeft') { hover = Math.max(0, (hover < 0 ? 3 : hover) - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { hover = Math.min(6, (hover < 0 ? 3 : hover) + 1); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { if (hover >= 0) tryDrop(hover); e.preventDefault(); }
  else if (/^[1-7]$/.test(e.key)) { hover = +e.key - 1; tryDrop(hover); }
});
$('restart').onclick = () => { if (!O || O.mode === 'online') return; if (O.mode === 'local') gameNo++; newGame(); };

/* ---- drawing ---- */
function disc(x, y, col, a) {
  const base = col === RED ? ['#ff9aae', '#ff2d55', '#a80027'] : ['#fff3a8', '#ffd23f', '#b98600'];
  ctx.save(); ctx.globalAlpha = a == null ? 1 : a;
  const g = ctx.createRadialGradient(x - 8, y - 9, 3, x, y, 28); g.addColorStop(0, base[0]); g.addColorStop(.55, base[1]); g.addColorStop(1, base[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 25, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 17, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x, y, 17, 3.6, 4.9); ctx.stroke();
  ctx.restore();
}
let last = performance.now();
function frame(t) {
  const dt = Math.min(.04, (t - last) / 1000); last = t;
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; if (a.tok !== token) { anims.splice(i, 1); continue; }
    a.vy += 2600 * dt; a.y += a.vy * dt; const ty = rowY(a.r);
    if (a.y >= ty) {
      if (!a.bounced && a.vy > 380) { a.y = ty; a.vy = -a.vy * .22; a.bounced = true; }
      else { anims.splice(i, 1); landed(a); }
    }
  }
  draw(t); requestAnimationFrame(frame);
}
function draw(t) {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, pal.back0 || '#222'); bg.addColorStop(1, pal.back1 || '#111');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // column highlight + preview
  const can = O && canPlay();
  if (can && hover >= 0) {
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(PAD + hover * CELL, TOP, CELL, ROWS * CELL);
    const pc = O.mode === 'local' ? turn : myColor, r = lowest(hover);
    const bob = Math.sin(t / 220) * 3;
    disc(colX(hover), 36 + bob, pc, .9);
    if (r >= 0) { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(colX(hover), rowY(r), 22, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  }

  const fg = ctx.createLinearGradient(0, TOP, W, TOP + 360); fg.addColorStop(0, pal.frame || '#333'); fg.addColorStop(.5, pal.frame2 || '#111'); fg.addColorStop(1, pal.frame || '#333');
  ctx.fillStyle = fg; ctx.fill('evenodd');

  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = pal.acc || '#fff'; ctx.globalAlpha = .75; ctx.beginPath(); rr(PAD - 6, TOP - 6, COLS * CELL + 12, ROWS * CELL + 12, 16); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) { ctx.beginPath(); ctx.arc(colX(c), rowY(r), 27, 0, 7); ctx.stroke(); }
  // win line
  if (winCells) {
    const p = (Math.sin(t / 160) + 1) / 2;
    ctx.strokeStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12 + 12 * p; ctx.lineWidth = 5;

    ctx.lineWidth = 4; ctx.globalAlpha = .8; ctx.beginPath(); ctx.moveTo(colX(winCells[0].c), rowY(winCells[0].r)); const e = winCells[winCells.length - 1]; ctx.lineTo(colX(e.c), rowY(e.r)); ctx.stroke();
