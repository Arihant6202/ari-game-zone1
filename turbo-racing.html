<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:48px;display:grid;place-items:center}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<style>
.azgame{touch-action:none;user-select:none;-webkit-user-select:none}

.nbtn.p2{background:linear-gradient(135deg,#ff3d9a,#ffb82e)}
.nbtn:active,.nbtn.on{transform:scale(.94);filter:brightness(1.3)}
.hint{font-size:11px;color:var(--muted);text-align:center;margin:0}

function loadPeer() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js';
    s.onload = () => window.Peer ? res() : rej(new Error('PeerJS failed')); s.onerror = () => rej(new Error('Could not load online service. Check internet.'));
    document.head.appendChild(s);
  });
}
function mkNet(conn, isHost) {
  const q = []; let fn = null, cl = null;
  const n = {
    host: isHost, open: true, _start: null,
    send(o) { try { conn.send(o); } catch (e) {} },
    on(f) { fn = f; q.splice(0).forEach(f); },
    onclose(f) { cl = f; if (!n.open) f(); },
    close() { try { conn.close(); } catch (e) {} },
  };
  conn.on('data', d => { if (d && d.__az === 'start') { n._start && n._start(d); return; } if (fn) fn(d); else q.push(d); });
  const gone = () => { if (n.open) { n.open = false; cl && cl(); } };
  conn.on('close', gone); conn.on('error', gone);
  return n;
}
const code4 = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };

/* ------------------------------ start screen ------------------------------ */
/* Az.start({game:'chess', extra:[{key:'side',label:'Play as',options:[['w','White'],['b','Black']]}], onStart(o){...}})
   o = { mode:'single'|'local'|'online', diff:'easy'|'medium'|'hard', level:n, extra:{...}, net:Net|null, seed:n, host:bool } */
Az.start = function (cfg) {
  const g = Az.game(cfg.game); const st = { mode: g.modes[0], diff: db().diff, level: Az.level(g.id), extra: {} };
  (cfg.extra || []).forEach(x => st.extra[x.key] = x.options[0][0]);
  const M = { single: '🤖 vs Computer', local: '👥 2 Players', online: '🌐 Online' };
  const m = Az.modal('<div id="stin"></div>', { sticky: true });
  let peer = null;
  const cleanup = () => { try { peer && peer.destroy(); } catch (e) {} peer = null; };
  function begin(o) { m.close(); Az.setBadge(o.mode === 'single' ? 'Lv ' + o.level : g.name); cfg.onStart(o); }
  function draw() {
    const unl = Az.level(g.id), pl = Az.place(st.level);
    const modes = g.modes.length > 1 ? `<div class="azlbl">Mode</div><div class="azrow">${g.modes.map(x => `<button class="azchip ${st.mode === x ? 'on' : ''}" data-mode="${x}">${M[x]}</button>`).join('')}</div>` : '';
    const diff = cfg.noDiff ? '' : `<div class="azlbl">Difficulty</div><div class="azrow">${['easy', 'medium', 'hard'].map(d => `<button class="azchip ${st.diff === d ? 'on' : ''}" data-diff="${d}">${{ easy: '😊 Easy', medium: '😎 Medium', hard: '🔥 Hard' }[d]}</button>`).join('')}</div>`;
    const lvl = (st.mode === 'single' && !cfg.noLevels) ? `<div class="azlbl">Level (unlocked ${unl} / ${g.max})</div><div class="azstep"><button data-lv="-10">«</button><button data-lv="-1">−</button><b>Level ${st.level}<br><small style="color:var(--muted)">${pl.emoji} ${pl.name}</small></b><button data-lv="1">+</button><button data-lv="10">»</button></div>` : '';
    const extra = (cfg.extra || []).map(x => `<div class="azlbl">${x.label}</div><div class="azrow">${x.options.map(op => `<button class="azchip ${st.extra[x.key] === op[0] ? 'on' : ''}" data-ex="${x.key}" data-v="${op[0]}">${op[1]}</button>`).join('')}</div>`).join('');
    let play;
    if (st.mode === 'online') play = `<div class="azlbl">Online room</div><div class="azrow c"><button class="azbtn" id="mk">➕ Create room</button><span style="align-self:center;color:var(--muted)">or</span><input class="azinput" id="jc" maxlength="4" placeholder="CODE"><button class="azbtn ghost" id="jn">Join</button></div><div class="azerr" id="neterr"></div><div id="netinfo"></div>`;
    else play = `<div class="azrow c" style="margin-top:18px"><button class="azbtn" id="go" style="font-size:17px;padding:13px 34px">▶ Play</button></div>`;
    $('#stin', m).innerHTML = `<div class="azbig">${g.emoji}</div><h2 style="text-align:center">${g.name}</h2><p class="sub" style="text-align:center">${g.desc}</p>${modes}${diff}${lvl}${extra}${play}<div class="azrow c" style="margin-top:14px"><a class="azbtn ghost sm" href="${BASE}index.html">🏠 Home</a>${g.shop.length ? '<button class="azbtn ghost sm" id="sh">🛒 Shop</button>' : ''}</div>`;
  }
  function online(kind, jcode) {
    const err = t => { const e = $('#neterr', m); if (e) e.textContent = t; };
    const info = h => { const e = $('#netinfo', m); if (e) e.innerHTML = h; };
    err(''); info('<p class="sub" style="text-align:center">Connecting…</p>');
    loadPeer().then(() => {
      const settings = () => ({ __az: 'start', diff: st.diff, level: 1, extra: st.extra, seed: Math.floor(Math.random() * 1e9) });
      if (kind === 'host') {
        const tryOpen = n => {
          const code = code4(); peer = new Peer('azgz-' + code);
          peer.on('error', e => { if (e.type === 'unavailable-id' && n < 4) { cleanup(); tryOpen(n + 1); } else err('Online error: ' + (e.type || e)); });
          peer.on('open', () => info(`<div class="azcode">${code}</div><p class="sub" style="text-align:center">Share this code with your friend and wait… ⏳</p>`));
          peer.on('connection', conn => {
            if (peer._used) { conn.close(); return; } peer._used = 1;
            const net = mkNet(conn, true); const s = settings();
            conn.on('open', () => { conn.send(s); begin({ mode: 'online', diff: s.diff, level: 1, extra: s.extra, seed: s.seed, net, host: true }); });
          });
        };
        tryOpen(0);
      } else {
        const code = (jcode || '').toUpperCase().trim(); if (code.length !== 4) { err('Enter the 4-letter code.'); info(''); return; }
        peer = new Peer(); let done = false;
        peer.on('error', e => { if (!done) err(e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Online error: ' + (e.type || e)); info(''); });
        peer.on('open', () => {
          const conn = peer.connect('azgz-' + code, { reliable: true }); const net = mkNet(conn, false);
          net._start = s => { if (done) return; done = true; begin({ mode: 'online', diff: s.diff, level: 1, extra: s.extra || {}, seed: s.seed, net, host: false }); };
          setTimeout(() => { if (!done) { err('Could not connect. Try again.'); info(''); } }, 14000);
        });
      }
    }).catch(e => { err(e.message); info(''); });
  }
  m.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.mode) { cleanup(); st.mode = t.dataset.mode; draw(); }
    else if (t.dataset.diff) { st.diff = t.dataset.diff; db().diff = st.diff; save(); draw(); }
    else if (t.dataset.lv) { st.level = Math.max(1, Math.min(Az.level(g.id), st.level + (+t.dataset.lv))); draw(); }
    else if (t.dataset.ex) { st.extra[t.dataset.ex] = t.dataset.v; draw(); }
    else if (t.id === 'go') begin({ mode: st.mode, diff: st.diff, level: st.mode === 'single' ? st.level : 1, extra: st.extra, net: null, seed: Math.floor(Math.random() * 1e9), host: true });
    else if (t.id === 'sh') Az.shop(g.shop);
    else if (t.id === 'mk') online('host');
    else if (t.id === 'jn') online('join', $('#jc', m).value);
  });
  draw(); return m;
};

/* Az.finish({game, level, diff, won, base, score?, title?, sub?, progress?, next(level), retry(level)})
   base = coins for a normal win at level 1 (Az scales by difficulty and level). */
Az.finish = function (r) {
  const g = Az.game(r.game), lvl = r.level || 1, dm = Az.diffMul(r.diff || 'medium');
  const coins = Math.round((r.base || 0) * dm * (1 + lvl * .04) * (r.won ? 1 : .25));
  const xp = Math.round(coins * .6 + (r.won ? 15 : 3));
  Az.addCoins(coins); Az.addXp(xp);
  let note = '', newBest = false;
  if (r.score != null) newBest = Az.setBest(g.id, r.score);
  if (r.won && r.progress !== false && lvl >= Az.level(g.id) && lvl < g.max) {
    Az.unlock(g.id, lvl + 1);
    const a = Az.place(lvl), b = Az.place(lvl + 1);
    note = `<p style="text-align:center;color:var(--a3)">🔓 Level ${lvl + 1} unlocked!${a.name !== b.name ? `<br>📍 New place: ${b.emoji} <b>${b.name}</b>` : ''}</p>`;
  }
  if (r.won && lvl >= g.max && r.progress !== false) note = '<p style="text-align:center;color:var(--a4)">👑 MAX LEVEL! You are a legend!</p>';
  Az.sfx(r.won ? 'win' : 'lose');
  const m = Az.modal(`<div class="azbig">${r.won ? '🏆' : '💥'}</div><h2 style="text-align:center">${r.title || (r.won ? 'You Win!' : 'Game Over')}</h2><p class="sub" style="text-align:center">${r.sub || ''}</p>
    <div class="azstat"><div><b>+${coins}</b><small>🪙 coins</small></div><div><b>+${xp}</b><small>⭐ XP</small></div>${r.score != null ? `<div><b>${r.score}</b><small>${newBest ? '🎉 New best!' : 'score'}</small></div>` : ''}</div>${note}
    <div class="azrow c">${(r.won && r.next && lvl < g.max && r.progress !== false) ? '<button class="azbtn" id="fn">Next level ▶</button>' : ''}<button class="azbtn ${r.won ? 'ghost' : ''}" id="fr">🔄 ${r.won ? 'Play again' : 'Try again'}</button></div>
    <div class="azrow c"><button class="azbtn ghost sm" id="fm">⚙️ Change mode</button>${g.shop.length ? '<button class="azbtn ghost sm" id="fs">🛒 Shop</button>' : ''}<a class="azbtn ghost sm" href="${BASE}index.html">🏠 Home</a></div>`, { sticky: true });
  m.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'fn') { m.close(); Az.setBadge('Lv ' + (lvl + 1)); r.next(lvl + 1); }
    else if (t.id === 'fr') { m.close(); r.retry ? r.retry(lvl) : location.reload(); }
    else if (t.id === 'fm') location.reload();
    else if (t.id === 'fs') Az.shop(g.shop);
  });
  return m;
};

/* ------------------------------ page chrome ------------------------------ */
function init() {
  if (!document.querySelector('link[href*="az.css"],style[data-az]')) { const l = el('link'); l.rel = 'stylesheet'; l.href = BASE + 'az.css'; document.head.appendChild(l); }
  if (!document.querySelector('link[href*="fonts.googleapis"]')) { const l = el('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap'; document.head.appendChild(l); }
  Az.setTheme(db().theme);
  const bg = el('div', 'azbg', '<i></i><i></i><i></i>'); bg.setAttribute('aria-hidden', 'true');
  ['🎮', '⭐', '👾', '🕹️', '🎲', '🚀', '🧩', '🏆'].forEach((e, i) => { const s = el('span', '', e); s.style.left = (6 + i * 12) + '%'; s.style.animationDuration = (21 + (i * 7) % 11) + 's'; s.style.animationDelay = '-' + ((i * 5) % 20) + 's'; bg.appendChild(s); });
  document.body.prepend(bg);
  const gid = document.body.dataset.game, g = gid && Az.game(gid);
  if (g || document.body.dataset.bar) {
    const bar = el('div', 'azbar', `<a class="azhome" href="${BASE}index.html" title="Home">🏠</a><div class="aztitle">${g ? g.emoji + ' ' + g.name : 'Ari Game Zone'}</div><div class="azbadges"><span class="azpill" id="azlv">${g ? 'Lv ' + Az.level(gid) : ''}</span><span class="azpill coin" id="azcoins">🪙 ${Az.coins()}</span>${g && g.shop.length ? '<button class="azbtn-i" id="azshopb" title="Shop">🛒</button>' : ''}<button class="azbtn-i" id="azsnd" title="Sound">${db().sound ? '🔊' : '🔇'}</button><button class="azbtn-i" id="azthm" title="Theme">🎨</button></div>`);
    document.body.insertBefore(bar, bg.nextSibling);
    bar.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.id === 'azshopb') Az.shop(g.shop);
      else if (t.id === 'azsnd') { db().sound = !db().sound; save(); t.textContent = db().sound ? '🔊' : '🔇'; }
      else if (t.id === 'azthm') Az.cycleTheme();
    });
  }
  { const dly = document.getElementById('daily'); if (dly && !document.getElementById('azlogin')) { const b = el('button', 'azbtn sm ghost', '👤 Login'); b.id = 'azlogin'; dly.parentNode.insertBefore(b, dly); b.onclick = () => Az.login(); } }
  try { if (localStorage.getItem('az_login')) authInit(); } catch (e) {}
  Az.refresh();
  document.dispatchEvent(new Event('az-ready'));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>
(function(){
const W=360,H=560,RX=60,RW=240,LN=4,LW=60,CAR_Y=440;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
function fit(){
  const aw=Math.min(window.innerWidth-20,460), ah=window.innerHeight-210;
  let w=Math.min(aw,Math.max(240,ah*W/H)); cv.style.width=w+'px'; cv.style.height=(w*H/W)+'px';
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
fit(); window.addEventListener('resize',fit);
const rnd=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=k<0?0:255,p=Math.abs(k);r=Math.round((f-r)*p+r);g=Math.round((f-g)*p+g);b=Math.round((f-b)*p+b);return'rgb('+r+','+g+','+b+')';}

/* per place look (index = Az.place index) */
const LOOK=[
 {s:['#6f7f95','#56657a'],road:'#3b3f51',deco:'bld',dark:0},
 {s:['#4f9a4a','#3f8a3c'],road:'#3c4046',deco:'tree',dark:0},
 {s:['#e0a860','#c98f4a'],road:'#6a5a48',deco:'cactus',dark:0},
 {s:['#f4fbff','#d7e6f3'],road:'#5a6270',deco:'pine',dark:0},
 {s:['#10122c','#1a1a3a'],road:'#1c1c2e',deco:'cityN',dark:1},
 {s:['#0a0018','#14002e'],road:'#0b0b1c',deco:'neon',dark:1},
 {s:['#2b1410','#3b1a12'],road:'#2a2020',deco:'lava',dark:1},
 {s:['#0b5d82','#0a4a69'],road:'#33506a',deco:'wave',dark:0},
 {s:['#02020a','#0a0a24'],road:'#1a1a3a',deco:'star',dark:1},
 {s:['#ff9ccc','#ff7eb6'],road:'#8a5a9a',deco:'candy',dark:0},
 {s:['#2d7a45','#1d5c34'],road:'#4a3f33',deco:'palm',dark:0},
 {s:['#150a30','#2a1060'],road:'#150f2c',deco:'star',dark:1}];
function look(level){const i=Math.floor((Math.max(1,level)-1)/4)%12;return LOOK[i];}

function drawDeco(type,x,y,r,right,L,acc){
  const d=right?1:-1;
  ctx.save();ctx.translate(x,y);
  if(type==='bld'||type==='cityN'){
    const w=30+r*18,h=34+r*26; ctx.fillStyle=type==='bld'?['#cfd8e3','#e9c9a0','#b8c4d6'][Math.floor(r*3)]:'#252a4a'; rr(d*8-(right?0:w),-h/2,w,h,4);ctx.fill();
    ctx.fillStyle=type==='bld'?'rgba(60,90,130,.6)':'#ffd166';
    for(let i=0;i<3;i++)for(let j=0;j<Math.floor(h/12);j++){if(type==='cityN'&&hash(x+y+i*7+j*3)<.4)continue;ctx.fillRect(d*8+(right?0:-w)+5+i*(w-10)/3,-h/2+5+j*11,5,6);}
  }else if(type==='tree'||type==='palm'){
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(d*18+4,6,16,9,0,0,7);ctx.fill();
    ctx.fillStyle='#5a3b22';ctx.fillRect(d*18-2,-2,4,10);
    ctx.fillStyle=type==='tree'?'#1f7a35':'#2eb85c';
    if(type==='tree'){for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(d*18+(i-1)*5,-8-i*2,12-i*2,0,7);ctx.fill();}}
    else{for(let i=0;i<6;i++){const a=i*1.05;ctx.beginPath();ctx.ellipse(d*18+Math.cos(a)*9,-4+Math.sin(a)*5,10,3.5,a,0,7);ctx.fill();}}
  }else if(type==='cactus'){
    ctx.fillStyle='#3d8f4a';rr(d*20-4,-18,8,28,4);ctx.fill();rr(d*20-13,-8,6,12,3);ctx.fill();rr(d*20+7,-12,6,12,3);ctx.fill();
    if(r>.6){ctx.fillStyle='#a8743a';ctx.beginPath();ctx.ellipse(d*34,6,8,5,0,0,7);ctx.fill();}
  }else if(type==='pine'){
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(d*20+4,12,14,7,0,0,7);ctx.fill();
    for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#1f6a4a':'#2a8a5c';ctx.beginPath();ctx.moveTo(d*20,-26+i*9);ctx.lineTo(d*20-13+i,-6+i*9);ctx.lineTo(d*20+13-i,-6+i*9);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(d*20,-26+i*9);ctx.lineTo(d*20-6,-17+i*9);ctx.lineTo(d*20+6,-17+i*9);ctx.fill();}
  }else if(type==='neon'){
    ctx.fillStyle=acc;ctx.shadowColor=acc;ctx.shadowBlur=14;ctx.fillRect(d*6-2,-34,4,68);ctx.fillRect(d*6-2+d*14,-20,3,40);
    ctx.fillStyle=r>.5?'#ff3d9a':'#b6ff3b';ctx.shadowColor=ctx.fillStyle;ctx.fillRect(d*26-1,-30,3,60);
  }else if(type==='lava'){
    ctx.fillStyle='#ff5a1f';ctx.shadowColor='#ff5a1f';ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(d*22,0,6+r*10,16+r*20,0,0,7);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#ffcf33';ctx.beginPath();ctx.ellipse(d*22,0,2+r*3,8+r*8,0,0,7);ctx.fill();
    ctx.fillStyle='#1a0d0a';ctx.beginPath();ctx.moveTo(d*40,10);ctx.lineTo(d*46,-14);ctx.lineTo(d*52,10);ctx.fill();
  }else if(type==='wave'){
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d*20,0,8+r*6,0,3.14,true);ctx.stroke();
    ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.arc(d*38,0,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(d*38-5,-1,10,2);
  }else if(type==='star'){
    ctx.fillStyle=r>.5?'#6a5acd':'#3a3a5a';ctx.beginPath();ctx.arc(d*22,0,6+r*12,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(d*22-3,-3,3+r*4,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(d*44,-20+r*30,2,2);
  }else if(type==='candy'){
    ctx.fillStyle='#fff';ctx.fillRect(d*20-2,-4,4,30);ctx.fillStyle=['#ff3d9a','#7c4dff','#00cfe8'][Math.floor(r*3)];ctx.beginPath();ctx.arc(d*20,-6,13,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(d*20,-6,7,0,5);ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- game state ---------------- */
let O,G,raf,last=0,paused=false,keys={},ptrs={};
const parts=[],floats=[];
function burst(x,y,n,col,sp,life){for(let i=0;i<n;i++){const a=rnd()*6.28,s=sp*(.3+rnd());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:(life||.6)*(.5+rnd()*.7),c:col,z:2+rnd()*3});}}
function say(x,y,t,c){floats.push({x,y,t,c:c||'#fff',l:0});}

function diffCfg(level,diff){
  const sm=Az.pick(diff,.88,1,1.12), dn=Az.pick(diff,.8,1,1.3);
  return {base:(36+level*.5)*10*sm, space:Math.max(165,500-level*3.4)/dn, maxCars:1+(level>14)+(level>40)+(level>75?0:0), lives:Az.pick(diff,5,3,2), L:look(level)};
}
function newCar(i,two){
  const skin=Az.eq('car');
  return {i,x:two?(i?RX+RW*.72:RX+RW*.28):W/2,y:CAR_Y,vx:0,w:30,h:54,lives:O.mode==='local'?3:diffCfg(O.level,O.diff).lives,nitro:40,boost:false,inv:0,dist:0,alive:true,sf:0,score:0,near:0,combo:0,comboT:0,coins:0,hit:0,color:i?'#ff9f1c':skin.color,spd:two?1:skin.speed,spin:0,dead:0};
}
function start(o){
  O=o;const two=o.mode==='local';
  O.level=two?1:o.level;
  const L=look(O.level);
  const place=Az.place(O.level);
  G={two,cars:[newCar(0,two)],traffic:[],pick:[],sc:0,t:0,cd:3.2,spawnD:0,coinD:200,nitD:900,shake:0,flash:0,state:'play',endT:0,cfg:null,rampLv:O.level,speedLines:[],target:two?0:1400+O.level*40,place,L,ptime:0};
  if(two)G.cars.push(newCar(1,two));
  G.cfg=diffCfg(two?10:O.level,O.diff);
  for(let i=0;i<14;i++)G.speedLines.push({x:rnd()*W,y:rnd()*H,l:20+rnd()*60});
  parts.length=0;floats.length=0;window.__g=G;
  Az.setBadge(two?'2 Players':'Lv '+O.level+' · '+place.emoji+' '+place.name);
  buildCtl();hud();
  cancelAnimationFrame(raf);last=performance.now();paused=false;raf=requestAnimationFrame(loop);
}
function buildCtl(){
  const c=document.getElementById('ctl');c.innerHTML='';
  const mk=(cls,txt,fn)=>{const b=document.createElement('button');b.className='azbtn nbtn '+cls;b.textContent=txt;
    const dn=e=>{e.preventDefault();fn(true);b.classList.add('on');},up=e=>{e.preventDefault();fn(false);b.classList.remove('on');};
    b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);c.appendChild(b);};
  if(G.two){mk('p1','⚡ P1 NITRO',v=>keys.p1n=v);mk('p2','⚡ P2 NITRO',v=>keys.p2n=v);}
  else mk('p1','⚡ NITRO',v=>keys.p1n=v);
  const p=document.createElement('button');p.className='azbtn ghost';p.textContent='⏸';p.onclick=()=>togglePause();c.appendChild(p);
  document.getElementById('hint').textContent=G.two?'P1: A / D + W nitro (left half)  ·  P2: ← / → + ↑ nitro (right half)':'Steer: ← → / A D or hold left/right side of the road  ·  Nitro: Space';
}
function togglePause(){if(!G||G.state!=='play')return;paused=!paused;if(!paused)last=performance.now();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state==='play')paused=true;});
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  keys[e.key.toLowerCase()]=true; if(e.key==='p'||e.key==='Escape')togglePause(); else if(paused&&G&&G.state==='play'){paused=false;last=performance.now();}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function ptrUpdate(e){const r=cv.getBoundingClientRect();ptrs[e.pointerId]=(e.clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptrUpdate(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}if(paused){paused=false;last=performance.now();}});
cv.addEventListener('pointermove',e=>{if(ptrs[e.pointerId]!=null)ptrUpdate(e);});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{delete ptrs[e.pointerId];}));
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function input(c){
  let dir=0,nit=false;const two=G.two;
  if(two){
    if(c.i===0){dir=(keys.d?1:0)-(keys.a?1:0);nit=!!(keys.w||keys.p1n);}
    else{dir=(keys.arrowright?1:0)-(keys.arrowleft?1:0);nit=!!(keys.arrowup||keys.p2n);}
    for(const id in ptrs){const x=ptrs[id],q=x/W*4;const k=Math.floor(q);
      if(c.i===0){if(k===0)dir=-1;else if(k===1)dir=1;}else{if(k===2)dir=-1;else if(k===3)dir=1;}}
  }else{
    dir=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);nit=!!(keys[' ']||keys.w||keys.arrowup||keys.p1n);
    for(const id in ptrs)dir+=ptrs[id]<W/2?-1:1;dir=clamp(dir,-1,1);
  }
  if(window.__bot&&window.__bot[c.i]){dir=window.__bot[c.i].dir||0;nit=!!window.__bot[c.i].nit;}
  return {dir,nit};
}

/* ---------------- spawning ---------------- */
function lx(l){return RX+LW*l+LW/2;}
function spawnRow(){
  const lv=G.rampLv,cfg=G.cfg;let n=1;
  if(lv>=4&&rnd()<.3+lv*.004)n=2; if(lv>=30&&rnd()<.3)n=3; n=Math.min(n,cfg.maxCars+(lv>=4?0:0),3);
  const lanes=[0,1,2,3].sort(()=>rnd()-.5);
  for(let k=0;k<n;k++){
    const l=lanes[k];let kind='car',r=rnd();
    if(lv>=6&&r<.16)kind='truck';else if(lv>=14&&r<.3)kind='police';else if(lv>=24&&r<.38)kind='bus';else if(lv>=34&&r<.5)kind='cone';
    const T={car:{w:30,h:54,f:[.32,.52]},truck:{w:38,h:116,f:[.26,.36]},police:{w:30,h:54,f:[.5,.62]},bus:{w:38,h:96,f:[.3,.4]},cone:{w:34,h:22,f:[0,0]}}[kind];
    const cols=['#f1c40f','#2ecc71','#9b59b6','#e67e22','#ecf0f1','#1abc9c','#e84393','#95a5a6'];
    G.traffic.push({kind,x:lx(l),tx:lx(l),y:-T.h-20,w:T.w,h:T.h,f:T.f[0]+rnd()*(T.f[1]-T.f[0]),col:cols[Math.floor(rnd()*cols.length)],near:false,hit:false,vx:0,rot:0,vr:0,sw:1+rnd()*1.5,t:rnd()*3});
  }
  return lanes.slice(0,n);
}
function spawnCoins(avoid){
  const free=[0,1,2,3].filter(l=>!avoid.includes(l));const l=free[Math.floor(rnd()*free.length)];
  for(let i=0;i<5;i++)G.pick.push({t:'coin',x:lx(l),y:-30-i*34});
}

/* ---------------- update ---------------- */
function update(dt){
  G.t+=dt;
  if(G.cd>0){G.cd-=dt;if(G.cd<=0){G.cd=0;Az.sfx('win');}}
  const go=G.cd<=0;
  if(G.two&&go){G.rampLv=Math.min(100,10+G.t*1.5);G.cfg=diffCfg(G.rampLv,O.diff);}
  const alive=G.cars.filter(c=>c.alive);
  const vb=G.cfg.base*(G.two?1:G.cars[0].spd);
  let v=0;
  G.cars.forEach(c=>{
    const inp=go?input(c):{dir:0,nit:false};
    if(!c.alive){c.dead+=dt;c.y+=60*dt;c.vx*=.95;c.x+=c.vx*dt;return;}
    const fin=G.state==='win';
    c.sf=clamp(c.sf+dt*(go?(c.hit>0?.9:.55):0),0,1);
    if(c.hit>0)c.hit-=dt; if(c.inv>0)c.inv-=dt; if(c.spin>0)c.spin-=dt;
    if(inp.nit&&c.nitro>0&&go){c.boost=true;c.nitro-=26*dt;}else{c.boost=false;if(c.nitro<100&&go)c.nitro+=1.8*dt;}
    if(c.nitro<=0){c.nitro=0;c.boost=false;}
    const sp=240+G.rampLv*.9;
    const tv=(c.spin>0?0:inp.dir)*sp;c.vx+=(tv-c.vx)*Math.min(1,dt*9);
    c.x+=c.vx*dt;c.x=clamp(c.x,RX+c.w/2+2,RX+RW-c.w/2-2);
    const ty=CAR_Y-(c.boost?(G.two?70:36):0)-(fin?260:0);c.y+=(ty-c.y)*Math.min(1,dt*5);
    const cv_=(c.boost?1.5:1)*c.sf;
    c.vv=cv_;
    c.dist+=vb*cv_*dt/10;
    if(c.boost&&rnd()<.9){parts.push({x:c.x+(rnd()-.5)*8,y:c.y+c.h/2,vx:(rnd()-.5)*30,vy:150+rnd()*100,l:0,m:.3,c:rnd()<.5?'#ffb82e':'#00e5ff',z:4});}
    else if(go&&rnd()<.25)parts.push({x:c.x+(rnd()-.5)*10,y:c.y+c.h/2,vx:0,vy:60,l:0,m:.25,c:'rgba(255,255,255,.4)',z:2});
    c.score=Math.floor(c.dist)+c.bonus|0;
  });
  G.cars.forEach(c=>{c.bonus=c.bonus||0;});

  }

  });

function crash(c,t){

  burst(c.x,c.y-c.h/2,26,'#ffb82e',320,.7);burst(c.x,c.y-c.h/2,14,'#ff4d6d',220,.6);burst(c.x,c.y,10,'#888',100,.9);
  if(c.lives<=0){c.alive=false;c.dead=0;c.vx=dir*120;burst(c.x,c.y,40,'#ff7a1a',360,1);burst(c.x,c.y,20,'#333',160,1.2);G.shake=22;}

function hud(){

function finish(){

  if(G.state==='win'&&!two){ctx.textAlign='center';ctx.fillStyle='#ffd166';ctx.font='900 30px Orbitron,sans-serif';ctx.fillText('FINISH!',W/2,230);}
  if(two&&G.cd>0.5){ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(W/2-.5,0,1,H);}
  if(paused){ctx.fillStyle='rgba(5,2,12,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 28px Orbitron,sans-serif';ctx.fillText('PAUSED',W/2,H/2-6);ctx.font='13px Poppins,sans-serif';ctx.fillText('Tap or press any key to resume',W/2,H/2+20);}
}
function loop(t){
  raf=requestAnimationFrame(loop);
  let dt=(t-last)/1000;last=t;if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(!paused)update(dt);
  render();
}
Az.start({game:'race',onStart:start});
window.__race={start};
})();
</script>
