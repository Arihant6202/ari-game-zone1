<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Dash · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=1.03.00"></head><body data-game="colordash"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">🎨</div><h1>Color Dash</h1><p class="sub">Tap the ink colour of the word before the bar runs out. 3 lives.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=1.03.00"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false,running=false;
function finish(won,sub){if(done)return;done=true;running=false;$('start').style.display='';Az.finish({game:'colordash',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}
function start(){if(running)return;Az.start({game:'colordash',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;running=true;$('start').style.display='none';run()}})}
$('start').onclick=start;

const C=[['RED','#ef4444'],['BLUE','#3b82f6'],['GREEN','#22c55e'],['YELLOW','#facc15'],['PURPLE','#a855f7'],['ORANGE','#fb923c']];
let round=0,lives=3,goal=10,limit=3000,ink=null,t0=0,raf=0,locked=false;
function run(){round=0;score=0;lives=3;goal=Math.min(30,10+Math.floor(level/4)+(diff==='hard'?4:diff==='easy'?-2:0));
 limit=Math.max(900,(diff==='hard'?2200:diff==='easy'?3800:3000)-level*14);next()}
function hud(){return '<p>Round <b>'+Math.min(round,goal)+'</b>/'+goal+' · Score <b>'+score+'</b> · '+'❤️'.repeat(lives)+'🖤'.repeat(3-lives)+'</p>'}
function next(){if(done)return;if(round>=goal){finish(true,'Perfect focus! Score '+score+' / '+goal+'.');return}
 round++;locked=false;const mean=C[Math.floor(Math.random()*C.length)];let inkc=C[Math.floor(Math.random()*C.length)];
 if(Math.random()<.8)while(inkc===mean)inkc=C[Math.floor(Math.random()*C.length)];ink=inkc;
 const opts=[inkc,...C.filter(x=>x!==inkc).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 $('gamearea').innerHTML=hud()+'<p style="margin:4px 0;color:var(--muted)">Tap the <b>INK COLOUR</b>, not the word!</p><h1 style="font-size:54px;margin:10px 0;color:'+inkc[1]+';text-shadow:0 0 18px '+inkc[1]+'88">'+mean[0]+'</h1><div style="height:8px;border-radius:6px;background:#ffffff18;overflow:hidden;margin:6px 0 14px"><i id="cdbar" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#34d399,#facc15,#ef4444)"></i></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+opts.map(v=>'<button class="azchip" data-v="'+v[0]+'" style="padding:20px 8px;font-size:18px;font-weight:800">'+v[0]+'</button>').join('')+'</div>';
 $('gamearea').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.v===ink[0]));
 t0=performance.now();cancelAnimationFrame(raf);const tick=()=>{if(done||locked)return;const f=1-(performance.now()-t0)/limit;const bar=$('cdbar');if(bar)bar.style.width=Math.max(0,f*100)+'%';if(f<=0){answer(false)}else raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function answer(ok){if(locked||done)return;locked=true;cancelAnimationFrame(raf);if(ok){score++;Az.sfx('coin')}else{lives--;Az.sfx('lose')}
 if(lives<=0){finish(false,'Out of lives! Score '+score+' / '+goal+'.');return}setTimeout(next,260)}
})();</script></body></html>
