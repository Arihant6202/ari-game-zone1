<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Dash · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=20"></head><body data-game="colordash"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">🎨</div><h1>Color Dash</h1><p class="sub">Match the target color.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=20"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false;function finish(won,sub){if(done)return;done=true;Az.finish({game:'colordash',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}function start(){Az.start({game:'colordash',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;run()}})}$('start').onclick=start;const colors=['RED','BLUE','GREEN','YELLOW','PURPLE'];let round=0,target='';function run(){round=0;score=0;next()}function next(){if(round>=12){finish(score>=7,'Matched '+score+' of 12 colors.');return}round++;target=colors[Math.floor(Math.random()*colors.length)];let opts=[target,...colors.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('gamearea').innerHTML='<h2>Tap: '+target+'</h2><div class="azrow c">'+opts.map(v=>'<button class="azchip" data-v="'+v+'" style="min-width:100px;padding:22px">'+v+'</button>').join('')+'</div><small>Round '+round+'/12</small>';$('gamearea').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.v===target)score++;next()})}})();</script></body></html>
