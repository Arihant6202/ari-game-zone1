<!DOCTYPE html>
<html lang="en">
<head>
<script src="firebase-config.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0614">
<title>UNO · Ari Game Zone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐤</text></svg>">
<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:78px;display:grid;place-items:center}
.azitem .fig{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.azitem .fig svg{max-width:100%}
.azitem.eq .fig{box-shadow:inset 0 0 0 1px var(--a3)}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.coinbig,.azpill.coin,#azcoins,#hC,#hCoin,#mycoins{color:#ffbf24!important}.az-coin-icon{width:1.22em;height:1.22em;object-fit:contain;vertical-align:-.22em;display:inline-block;filter:drop-shadow(0 1px 2px rgba(255,190,30,.35))}</style>
</head>
<body data-game="uno">
<style>
.uno{width:min(980px,100% - 16px);margin:10px auto 40px;display:flex;flex-direction:column;gap:12px}
.ubots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ubot{min-width:104px;padding:8px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:box-shadow .2s,border-color .2s}
.ubot.turn{border-color:var(--a3);box-shadow:0 0 22px -6px var(--a3)}
.ubot b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.ubot .n{font-family:Orbitron,sans-serif;font-size:20px;color:var(--a4)}
.ubot .fan{display:flex;justify-content:center;margin-top:4px;height:22px}
.ubot .fan i{width:14px;height:22px;margin-left:-8px;border-radius:3px;background:linear-gradient(135deg,var(--cb2,#222),var(--cb1,#444));border:1px solid #fff8;display:block}
.ubot .fan i:first-child{margin-left:0}
.utable{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px;border-radius:22px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.1),transparent 70%),var(--panel);border:1px solid var(--line);position:relative}
.ucol{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 18px -2px currentColor;transition:background .25s}
.udir{font-size:26px;opacity:.85;min-width:30px;text-align:center}
.card.uc{position:relative;width:72px;height:106px;border-radius:12px;border:3px solid #fff;color:#fff;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:28px;cursor:default;padding:0;user-select:none;box-shadow:0 6px 14px -6px #000;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:none;min-height:0;transition:transform .15s,box-shadow .15s;overflow:hidden}
.card.uc::before{display:none}
.card.uc .oval{position:absolute;width:72%;height:62%;background:rgba(255,255,255,.92);border-radius:50%;transform:rotate(-24deg);z-index:0}
.card.uc span{position:relative;z-index:1}
.card.uc .cn{position:absolute;z-index:1;font-size:13px;top:3px;left:6px}
.card.uc .cn.b{top:auto;bottom:3px;left:auto;right:6px;transform:rotate(180deg)}
.card.uc.red{background:#e53935}.card.uc.blue{background:#1e88e5}.card.uc.green{background:#43a047}.card.uc.yellow{background:#fbc02d}.card.uc.wild{background:conic-gradient(#e53935 0 25%,#1e88e5 0 50%,#43a047 0 75%,#fbc02d 0)}
.card.uc .oval.col{mix-blend-mode:normal}
.card.uc.red span.v{color:#e53935;text-shadow:none}.card.uc.blue span.v{color:#1e88e5;text-shadow:none}.card.uc.green span.v{color:#43a047;text-shadow:none}.card.uc.yellow span.v{color:#e0a100;text-shadow:none}.card.uc.wild span.v{color:#222;text-shadow:none}
.card.uc.back{background:radial-gradient(circle at 50% 50%,var(--cb1,#e53935) 0 28%,var(--cb2,#111) 29%);}
.card.uc.back span{color:#fff;font-size:18px;text-shadow:0 2px 0 #000;transform:rotate(-20deg)}
.card.uc.back .oval{display:none}
.uhand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);min-height:140px}
.uhand button.card.uc{cursor:pointer}
.uhand button.card.uc.ok{transform:translateY(-10px);box-shadow:0 0 0 3px var(--a3),0 10px 18px -6px var(--a3)}
.uhand button.card.uc:not(.ok){filter:saturate(.55) brightness(.78)}
.uhand button.card.uc.ok:hover{transform:translateY(-18px) scale(1.05)}
.uhand button.card.uc:focus-visible{outline:3px solid var(--a1)}
.uhand h3{width:100%;margin:0;text-align:center;font-size:14px;color:var(--muted)}
.uact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.uact .azbtn{font-size:15px}
.unobtn{background:linear-gradient(135deg,#e53935,#fbc02d)!important;color:#fff!important;text-shadow:0 1px 2px #0008}
.uanim{animation:azpop .35s}
.uland{animation:uland .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes uland{from{transform:translateY(-60px) scale(1.5) rotate(-18deg);opacity:0}}
.uunofx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:150;font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(40px,14vw,90px);color:#fff;text-shadow:0 0 30px #ff3d9a,0 4px 0 #e53935;pointer-events:none;animation:uunofx 1.1s ease-out forwards}
@keyframes uunofx{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.ubot.turn .n::after{content:' 🤔';font-size:14px}
.uhand.many button.card.uc{margin-left:-26px}
.uhand.many button.card.uc:first-of-type{margin-left:0}
.card.uc::after{content:'';position:absolute;inset:0;border-radius:9px;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
#draw:not(:disabled){animation:udp 1.6s ease-in-out infinite}
@keyframes udp{50%{box-shadow:0 0 0 4px var(--ring)}}
.ucover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(8,4,20,.94);text-align:center;padding:20px}
.ucover .box{max-width:380px}
.upick{display:grid;grid-template-columns:repeat(2,90px);gap:10px;justify-content:center;margin:14px 0}
.upick button{height:70px;border-radius:16px;border:3px solid #fff;font-weight:800;color:#fff;font-size:15px;cursor:pointer}
@media (max-width:560px){.card.uc{width:58px;height:88px;font-size:22px}.utable{gap:12px}}
</style>
<main class="uno">
  <div class="azhud"><span class="azpill" id="hMode">UNO</span><span class="azpill" id="hDeck">🂠 0</span><span class="azpill" id="hTurn">—</span></div>
  <div class="ubots" id="bots"></div>
  <div class="utable">
    <div style="text-align:center"><div id="drawpile"></div><small style="color:var(--muted)">Draw pile</small></div>
    <div class="udir" id="dir">↻</div>
    <div style="text-align:center"><div id="top"></div><small style="color:var(--muted)">Discard</small></div>
    <div style="text-align:center"><div class="ucol" id="col" style="color:#e53935;background:#e53935"></div><small style="color:var(--muted)">Colour</small></div>
  </div>
  <div class="azmsg" id="msg">Game started!</div>
  <div class="uact"><button class="azbtn ghost" id="draw">🂠 Draw card</button><button class="azbtn ghost" id="pass" hidden>⏭ Pass</button><button class="azbtn unobtn" id="uno">🔔 UNO!</button><button class="azbtn ghost sm" id="rst">🔄 New game</button></div>
  <div class="uhand" id="hand"></div>
  <p class="azmsg" style="color:var(--muted);font-size:12px;font-weight:400">Match colour or number • Skip ⊘ • Reverse ⇄ • +2 • Wild • Wild +4 • Don't forget to press <b>UNO!</b> on your second-to-last card (or take a +2 penalty)</p>
</main>
<script src="az.js?v=15"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const COLORS=['red','blue','green','yellow'],CHEX={red:'#e53935',blue:'#1e88e5',green:'#43a047',yellow:'#fbc02d'},CNAME={red:'Red 🔴',blue:'Blue 🔵',green:'Green 🟢',yellow:'Yellow 🟡'};
const SYM={skip:'⊘',rev:'⇄',d2:'+2',w:'W',w4:'+4'};
function mkDeck(){const a=[];COLORS.forEach(c=>{a.push({c,v:'0'});for(let n=1;n<=9;n++){a.push({c,v:''+n},{c,v:''+n});}['skip','rev','d2'].forEach(v=>a.push({c,v},{c,v}));});for(let i=0;i<4;i++)a.push({c:'wild',v:'w'},{c:'wild',v:'w4'});return shuffle(a);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pts=c=>/^\d$/.test(c.v)?+c.v:(c.c==='wild'?50:20);
let O=null,G=null,botT=0,unoT=0,lastMsg='',lastSent='',shownEnd=false,topKey='';
const peerName=()=>(O&&O.net&&O.net.peer&&O.net.peer.name)||'Friend';
function applyBack(){const b=Az.eq('cardback'),r=document.documentElement.style;r.setProperty('--cb1',b.c1||'#e53935');r.setProperty('--cb2',b.c2||'#111');}

function nextIdx(p,s){const n=G.hands.length;return ((p+G.dir*s)%n+n)%n;}
function drawCard(){if(!G.deck.length){const top=G.disc.pop();G.deck=shuffle(G.disc.map(c=>c.c==='wild'?{c:'wild',v:c.v}:c));G.disc=[top];}return G.deck.pop();}
function give(p,n){for(let i=0;i<n;i++){const c=drawCard();if(c)G.hands[p].push(c);}G.said[p]=false;}
function playable(c){if(G.pend>0)return c.v==='d2'||c.v==='w4';return c.c==='wild'||c.c===G.color||c.v===G.top.v;}
function msg(t){lastMsg=t;$('msg').textContent=t;}

function newGame(){
  clearTimeout(botT);clearTimeout(unoT);
  const online=O.mode==='online',n=online?2:+(O.extra.n||2),single=O.mode==='single';
  G={online,me:online?0:0,winner:null,pts:null,n,single,deck:mkDeck(),disc:[],hands:Array.from({length:n},()=>[]),said:Array(n).fill(false),turn:0,dir:1,color:'red',top:null,drew:false,over:false,pend:0,stack:!!(O.extra&&O.extra.stack==='1')||false,wait:false,
     names:online?[Az.name(),peerName()]:Array.from({length:n},(_,i)=>single?(i===0?'You':'Bot '+i):'Player '+(i+1)),bot:Array.from({length:n},(_,i)=>single&&i>0),cover:false,penalty:null};
  for(let p=0;p<n;p++)for(let i=0;i<7;i++)G.hands[p].push(G.deck.pop());
  let c;do{c=G.deck.pop();if(!/^\d$/.test(c.v)){G.deck.unshift(c);c=null;}}while(!c);
  G.top=c;G.disc.push(c);G.color=c.c;
  $('hMode').textContent=online?'🌐 Online 1v1':single?('🤖 vs '+(n-1)+' bot'+(n>2?'s':'')):('👥 '+n+' players');
  shownEnd=false;msg(online?'Game started! '+G.names[0]+' plays first.':'Game started! You go first.');startTurn();
}
function cardEl(c,opt){opt=opt||{};const b=document.createElement(opt.btn?'button':'div');b.className='card uc '+(opt.back?'back':c.c)+(opt.cls?' '+opt.cls:'');
  if(opt.back){b.innerHTML='<span>UNO</span>';return b;}
  const sym=SYM[c.v]||c.v,sm=c.v==='w4'?'+4':sym;
  b.innerHTML='<i class="oval"></i><span class="cn">'+sm+'</span><span class="v">'+sm+'</span><span class="cn b">'+sm+'</span>';
  b.setAttribute('aria-label',(c.c==='wild'?'Wild ':c.c+' ')+(({skip:'skip',rev:'reverse',d2:'draw two',w:'',w4:'draw four'})[c.v]||c.v));return b;}

function showHand(p){return !G.bot[p]&&(G.single||!G.cover);}
function render(){
  if(!G)return;
  if(G.online&&O.host){G.names=[Az.name(),peerName()];}
  $('hDeck').textContent='🂠 '+G.deck.length;
  $('hTurn').textContent=G.over?'Game over':(G.names[G.turn]+"'s turn");
  $('dir').textContent=G.dir>0?'↻':'↺';
  const col=$('col');col.style.background=CHEX[G.color]||'#888';col.style.color=CHEX[G.color]||'#888';
  const tp=$('top');tp.innerHTML='';tp.style.position='relative';const below=G.disc&&G.disc.length>1?G.disc.slice(-3,-1):[];below.forEach((bc,k)=>{const be=cardEl(bc);be.style.cssText='position:absolute;left:0;top:0;transform:rotate('+((k?1:-1)*(7+k*4))+'deg);opacity:.85;filter:brightness(.7)';tp.appendChild(be);});const te=cardEl(G.top);if(topKey!==G.top.c+G.top.v+G.disc.length)te.classList.add('uland');te.style.position='relative';topKey=G.top.c+G.top.v+(G.disc?G.disc.length:0);tp.appendChild(te);if(below.length)tp.style.minHeight='106px';
  const dp=$('drawpile');dp.innerHTML='';dp.appendChild(cardEl(null,{back:1}));
  const bots=$('bots');bots.innerHTML='';
  G.names.forEach((nm,i)=>{ if(G.online?i===G.me:(G.single&&i===0))return;
    const d=document.createElement('div');d.className='ubot'+(G.turn===i&&!G.over?' turn':'');
    const k=Math.min(G.hands[i].length,10);d.innerHTML='<b></b><div class="n">'+G.hands[i].length+'</div><div class="fan">'+'<i></i>'.repeat(k)+'</div>';
    d.querySelector('b').textContent=nm+(G.hands[i].length===1?' · UNO!':'');bots.appendChild(d);});
  const me=G.online?G.me:(G.single?0:G.turn),hand=$('hand');hand.innerHTML='';hand.className='uhand'+(G.hands[me]&&G.hands[me].length>9?' many':'');
  const isMyTurn=!G.over&&!G.bot[G.turn]&&!G.wait&&!G.cover&&(!G.online||G.turn===G.me);
  const h3=document.createElement('h3');h3.textContent=(G.single||G.online)?('Your cards ('+G.hands[me].length+')'):(G.names[me]+' cards ('+G.hands[me].length+')');hand.appendChild(h3);
  if(showHand(me)){
    const sorted=G.hands[me].map((c,i)=>({c,i})).sort((a,b)=>(COLORS.indexOf(a.c.c)<0?9:COLORS.indexOf(a.c.c))-(COLORS.indexOf(b.c.c)<0?9:COLORS.indexOf(b.c.c))||(''+a.c.v).localeCompare(''+b.c.v,undefined,{numeric:true}));
    sorted.forEach(({c,i})=>{const ok=isMyTurn&&playable(c)&&(!G.drew||G.drewIdx===i);const b=cardEl(c,{btn:1,cls:ok?'ok':''});b.disabled=!ok;b.onclick=()=>humanPlay(i);hand.appendChild(b);});
  }else{const s=document.createElement('p');s.className='sub';s.textContent='🙈 Cards are hidden';hand.appendChild(s);}
  $('draw').textContent=G.pend>0?('🂠 Draw +'+G.pend):'🂠 Draw card';
  $('draw').disabled=!isMyTurn||G.drew;
  $('pass').hidden=!(isMyTurn&&G.drew);
  $('uno').disabled=G.online?(G.over||!(G.penalty===G.me||(isMyTurn&&G.hands[G.me].length<=2))):(G.over||!(G.penalty!=null||(isMyTurn&&G.hands[G.turn].length<=2)));
  if(G.online&&O.host)sendView();
}
/* ---------- online (host runs the game, guest sends actions) ---------- */
function sendView(){
  if(!G||!G.online||!O.host||!O.net)return;
  const v={me:1,n:2,deck:G.deck.length,hands:[G.hands[0].map(()=>0),G.hands[1]],said:G.said,turn:G.turn,dir:G.dir,color:G.color,top:G.top,drew:G.drew,drewIdx:G.drewIdx,over:G.over,winner:G.winner,pts:G.pts,penalty:G.penalty,pend:G.pend,stack:G.stack,names:G.names,msg:lastMsg};
  const j=JSON.stringify(v);if(j===lastSent)return;lastSent=j;O.net.send({t:'st',v});
}
function applyView(v){
  G=Object.assign({},v,{deck:new Array(v.deck).fill(0),disc:[],bot:[false,false],cover:false,wait:false,single:false,online:true,me:1});
  if(v.msg){lastMsg=v.msg;$('msg').textContent=v.msg;}
  render();
  if(G.over&&G.winner!=null){if(!shownEnd){shownEnd=true;finish(G.winner);}}else shownEnd=false;
}
function onNet(m){
  if(!m||!G)return;
  if(m.t==='again'){if(G.over){lastSent='';newGame();}return;}
  if(G.over)return;
  if(m.t==='uno'){doUno(1);return;}
  if(G.turn!==1||G.wait)return;
  if(m.t==='play'){const i=+m.i,c=G.hands[1][i];if(!c||!playable(c)||(G.drew&&G.drewIdx!==i))return;commit(1,i,c.c==='wild'?(COLORS.includes(m.col)?m.col:'red'):c.c);}
  else if(m.t==='draw')doDraw();
  else if(m.t==='pass')doPass();
}

function startTurn(){
  render();
  if(G.over)return;
  if(G.bot[G.turn]){G.wait=true;render();botT=setTimeout(botMove,850+Math.random()*500);return;}
  if(!G.single&&!G.online){G.cover=true;render();setTimeout(()=>{if(G&&!G.over&&G.cover)showCover();},G.penalty!=null?2700:0);return;}
}
function showCover(){
  const p=G.turn,m=Az.modal('<div style="text-align:center"><div class="azbig">📱</div><h2>'+G.names[p]+'</h2><p class="sub">Hand the device to '+G.names[p]+'. Everyone else, look away! 🙈</p><div class="azrow c"><button class="azbtn" id="shw">👀 Show my cards</button></div></div>',{sticky:true});
  m.addEventListener('click',e=>{if(e.target.id==='shw'){m.close();G.cover=false;msg(G.names[p]+': your turn!');render();}});
}
function humanPlay(i){
  if(G.over||G.bot[G.turn]||G.wait)return;
  if(G.online&&G.turn!==G.me)return;
  const p=G.turn,c=G.hands[p][i];if(!c||!playable(c))return;
  const go=col=>{if(G.online&&!O.host){G.wait=true;render();O.net.send({t:'play',i,col});}else commit(p,i,col);};
  if(c.c==='wild')chooseColor(go);else go(c.c);
}
function chooseColor(cb){
  const m=Az.modal('<div style="text-align:center"><h2>Choose a colour 🎨</h2><div class="upick">'+COLORS.map(c=>'<button data-c="'+c+'" style="background:'+CHEX[c]+';'+(c==='yellow'?'color:#222':'')+'">'+c.toUpperCase()+'</button>').join('')+'</div></div>',{sticky:true});
  m.addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b){m.close();cb(b.dataset.c);}});
}
function unoFx(n){const d=document.createElement('div');d.className='uunofx';d.textContent='UNO!';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
function commit(p,i,col){
  const c=G.hands[p].splice(i,1)[0];G.disc.push(c);G.top=c;G.color=col||c.c;G.drew=false;
  Az.sfx(c.c==='wild'?'win':'click');
  const name=G.names[p];let text=name+' played '+(c.c==='wild'?'':c.c+' ')+(SYM[c.v]||c.v)+'.';
  if(G.hands[p].length===0){msg(name+' played the last card! 🎉');G.over=true;G.winner=p;G.pts=G.hands.reduce((s,h,i)=>i===p?s:s+h.reduce((a,c)=>a+pts(c),0),0);render();return finish(p);}
  if(G.hands[p].length===1){
    if(G.bot[p]||G.said[p]){unoFx(name);text+=' 🔔 '+name+': UNO!';G.said[p]=true;}
    else{G.penalty=p;clearTimeout(unoT);unoT=setTimeout(()=>{if(G&&G.penalty===p&&!G.over){G.penalty=null;give(p,2);Az.sfx('lose');msg('😬 '+G.names[p]+' forgot to say UNO — +2 penalty!');render();}},2600);text+=' ⚡ Press UNO! quickly!';}
  }
  let step=1;
  if(c.v==='skip'){step=2;text+=' '+G.names[nextIdx(p,1)]+' is skipped.';}
  else if(c.v==='rev'){G.dir*=-1;if(G.hands.length===2)step=2;text+=' Direction reversed!';}
  else if(c.v==='d2'){const v=nextIdx(p,1);if(G.stack){G.pend=(G.pend||0)+2;text+=' Pending: +'+G.pend+' for '+G.names[v]+'!';}else{give(v,2);step=2;text+=' '+G.names[v]+' draws 2 cards.';}}
  else if(c.v==='w4'){const v=nextIdx(p,1);if(G.stack){G.pend=(G.pend||0)+4;text+=' Pending: +'+G.pend+' for '+G.names[v]+'! Colour: '+CNAME[G.color];}else{give(v,4);step=2;text+=' '+G.names[v]+' draws 4 cards. Colour: '+CNAME[G.color];}}
  else if(c.v==='w'){text+=' Colour: '+CNAME[G.color];}
  G.turn=nextIdx(p,step);G.wait=false;msg(text);
  startTurn();
}
function doDraw(){
  if(!G||G.over||G.bot[G.turn]||G.wait||G.drew||G.cover)return;
  const p=G.turn;if(G.pend>0){const n=G.pend;G.pend=0;give(p,n);Az.sfx('lose');G.drew=false;G.turn=nextIdx(p,1);msg(G.names[p]+' draws '+n+' cards!');startTurn();return;}
  give(p,1);const idx=G.hands[p].length-1,c=G.hands[p][idx];Az.sfx('pop');
  if(playable(c)){G.drew=true;G.drewIdx=idx;msg('You drew a card — play it or Pass.');render();}
  else{msg(G.names[p]+' drew a card and could not play. Next!');G.drew=false;G.turn=nextIdx(p,1);startTurn();}
}
function doPass(){if(!G||!G.drew)return;const p=G.turn;G.drew=false;G.turn=nextIdx(p,1);msg(G.names[p]+' passed.');startTurn();}
function doUno(who){
  if(!G||G.over)return;
  if(G.penalty!=null){if(G.online&&G.penalty!==who)return;G.said[G.penalty]=true;G.penalty=null;clearTimeout(unoT);Az.sfx('coin');msg('🔔 UNO! Safe.');render();return;}
  const p=G.online?who:G.turn;if(!G.bot[p]&&G.hands[p].length<=2){G.said[p]=true;Az.sfx('coin');Az.toast('🔔 UNO call ready!',1200);}
}
const isGuest=()=>G&&G.online&&!O.host;
$('draw').onclick=()=>{if(isGuest()){if(G.turn===G.me&&!G.wait&&!G.drew)O.net.send({t:'draw'});return;}if(G&&G.online&&G.turn!==0)return;doDraw();};
$('pass').onclick=()=>{if(isGuest()){if(G.turn===G.me&&G.drew)O.net.send({t:'pass'});return;}if(G&&G.online&&G.turn!==0)return;doPass();};
$('uno').onclick=()=>{if(isGuest()){O.net.send({t:'uno'});return;}doUno(0);};
$('rst').onclick=()=>{if(O)newGame();};

/* ---------- bots ---------- */
function botMove(){
  if(!G||G.over)return;const p=G.turn;if(!G.bot[p])return;
  const h=G.hands[p],ok=h.map((c,i)=>({c,i})).filter(x=>playable(x.c));
  if(G.pend>0&&!ok.length){const n=G.pend;G.pend=0;give(p,n);Az.sfx('lose');msg(G.names[p]+' draws '+n+' cards!');G.wait=false;G.turn=nextIdx(p,1);startTurn();return;}
  const lvl=O.diff||'medium';
  function pick(list){
    if(lvl==='easy')return list[Math.floor(Math.random()*list.length)];
    const cnt={};h.forEach(c=>{if(c.c!=='wild')cnt[c.c]=(cnt[c.c]||0)+1;});
    const next=G.hands[nextIdx(p,1)].length;
    const sc=x=>{const c=x.c;let s=0;if(c.c==='wild')s-=(h.length>3?25:-5);else{s+=(cnt[c.c]||0)*2;}
      if(['skip','rev','d2'].includes(c.v))s+=(next<=2||lvl==='hard')?10:3;if(/^\d$/.test(c.v))s+=(+c.v)*.3;return s+Math.random();};
    return list.slice().sort((a,b)=>sc(b)-sc(a))[0];
  }
  if(ok.length){
    const x=pick(ok);let col=x.c.c;
    if(col==='wild'){const cnt={red:0,blue:0,green:0,yellow:0};h.forEach((c,i)=>{if(c.c!=='wild'&&i!==x.i)cnt[c.c]++;});col=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||Math.random()-.5)[0];}
    G.wait=false;commit(p,x.i,col);
  }else{
    give(p,1);const c=h[h.length-1];
    if(playable(c)){let col=c.c;if(col==='wild'){const cnt={red:0,blue:0,green:0,yellow:0};h.forEach(k=>{if(k.c!=='wild')cnt[k.c]++;});col=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];}G.wait=false;commit(p,h.length-1,col);}
    else{msg(G.names[p]+' drew a card and passed.');G.wait=false;G.turn=nextIdx(p,1);startTurn();}
  }
}

/* ---------- end ---------- */
function finish(w){
  const n=G.n,pointsWon=G.pts!=null?G.pts:G.hands.reduce((s,h,i)=>i===w?s:s+h.reduce((a,c)=>a+pts(c),0),0);
  if(G.online){
    const won=w===G.me;
    Az.finish({game:'uno',level:1,diff:'medium',won,base:won?25:8,score:won?pointsWon:0,
      title:won?'🎉 UNO! You win!':'😔 '+G.names[w]+' wins',sub:won?(pointsWon+' points earned.'):'Play a rematch!',progress:false,
      retry:()=>{if(O.host){lastSent='';newGame();}else{O.net.send({t:'again'});Az.toast('Waiting for the host… ⏳',2500);}}});
    return;
  }
  if(G.single){
    const won=w===0;
    Az.finish({game:'uno',level:1,diff:O.diff||'medium',won,base:won?(30+(n-2)*10):10,score:won?pointsWon:0,
      title:won?'🎉 UNO! You win!':'😔 '+G.names[w]+' wins',sub:won?(pointsWon+' points earned from opponents\' cards.'):'You will win next time!',progress:false,retry:()=>newGame()});
  }else{
    Az.finish({game:'uno',level:1,diff:'medium',won:true,base:15,score:pointsWon,title:'🎉 '+G.names[w]+' wins!',sub:pointsWon+' points.',progress:false,retry:()=>newGame()});
  }
}
window.__UNO={get G(){return G;},playable,newGame:()=>newGame()};
Az.start({game:'uno',noLevels:true,extra:[{key:'n',label:'Players (not for online)',options:[['2','2 Players'],['3','3 Players'],['4','4 Players']]},{key:'stack',label:'Stack +2 / +4 cards',options:[['0','Off (classic)'],['1','On (stack draw cards)']]}],onStart:o=>{
  O=o;applyBack();
  if(o.mode==='online'){
    $('rst').hidden=true;
    o.net.on(m=>{if(o.host)onNet(m);else if(m&&m.t==='st')applyView(m.v);});
    o.net.onclose(()=>{if(G&&!G.over){G.over=true;clearTimeout(unoT);Az.finish({game:'uno',level:1,diff:'medium',won:true,base:15,progress:false,title:'Friend left',sub:'Your friend left the game.',retry:()=>location.reload()});}});
    if(o.host)newGame();else{$('hMode').textContent='🌐 Online 1v1';msg('Waiting for the host to start…');}
  }else newGame();
}});
})();
</script>
