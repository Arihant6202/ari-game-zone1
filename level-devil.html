<style data-az>
/* Ari Game Zone - shared styles (themes, bar, modals, buttons, game layout) */
:root{
  --bg1:#0a0614;--bg2:#2a0f55;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --text:#f5f3ff;--muted:#b9b0dc;--a1:#00e5ff;--a2:#ff3d9a;--a3:#b6ff3b;--a4:#ffb82e;--bad:#ff4d6d;
  --canvas:#0b0620;--ink:#10061f;--ring:rgba(0,229,255,.3);
  --blob1:rgba(255,61,154,.35);--blob2:rgba(0,229,255,.28);--blob3:rgba(124,58,237,.38);
}
[data-theme=sunset]{--bg1:#1a0a12;--bg2:#4a1630;--text:#fff4ee;--muted:#dcb6a8;--a1:#ff9f1c;--a2:#ff3b81;--a3:#ffe066;--a4:#ff6b4a;--canvas:#210b16;--ink:#2a0a12;--ring:rgba(255,159,28,.3);--blob1:rgba(255,107,74,.38);--blob2:rgba(255,184,46,.26);--blob3:rgba(255,59,129,.32)}
[data-theme=ocean]{--bg1:#031018;--bg2:#0b3354;--text:#eaf7ff;--muted:#9fc3d9;--a1:#2dd4ff;--a2:#3b82f6;--a3:#34f5b0;--a4:#a78bfa;--canvas:#04141f;--ink:#02121c;--ring:rgba(45,212,255,.3);--blob1:rgba(45,212,255,.28);--blob2:rgba(59,130,246,.34);--blob3:rgba(52,245,176,.2)}
[data-theme=forest]{--bg1:#04120a;--bg2:#0f4a2a;--text:#effff4;--muted:#a6d4b4;--a1:#7CFC8A;--a2:#ffd23f;--a3:#c6ff5a;--a4:#ff9f43;--canvas:#05170d;--ink:#04120a;--ring:rgba(124,252,138,.3);--blob1:rgba(124,252,138,.25);--blob2:rgba(255,210,63,.2);--blob3:rgba(34,139,34,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--bg2),transparent 60%),var(--bg1);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',system-ui,sans-serif}
a{color:inherit}
[hidden]{display:none!important}

/* animated background */
.azbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.azbg i{position:absolute;border-radius:50%;filter:blur(70px);animation:azdrift 18s ease-in-out infinite alternate}
.azbg i:nth-of-type(1){width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:var(--blob1)}
.azbg i:nth-of-type(2){width:40vmax;height:40vmax;right:-14vmax;top:20vh;background:var(--blob2);animation-duration:23s}
.azbg i:nth-of-type(3){width:44vmax;height:44vmax;left:20vw;bottom:-20vmax;background:var(--blob3);animation-duration:27s}
.azbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.azbg span{position:absolute;bottom:-70px;font-size:28px;opacity:.18;animation:azrise linear infinite}

/* top bar */
.azbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,6,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.azbar .azhome{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:18px}
.azbar .aztitle{flex:1;min-width:0;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:clamp(12px,3.6vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbadges{display:flex;gap:6px;align-items:center}
.azpill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.azpill.coin{color:var(--a4)}
.azbtn-i{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.azbtn-i:hover{border-color:var(--a1)}

/* buttons / inputs */
.azbtn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--a1);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.azbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}.azbtn:active{transform:scale(.95)}
.azbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.azbtn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.azbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.azchip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.azchip:hover{border-color:var(--a1)}
.azchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--a1)}
.azinput{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:150px}
.azinput:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px var(--ring)}

/* game page layout */
.azgame{width:min(980px,100% - 20px);margin:12px auto 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.azhud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.azhud .azpill{font-size:13px}
.azstage{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.azgame canvas{display:block;max-width:100%;border-radius:16px;background:var(--canvas);box-shadow:0 0 0 1px var(--line),0 0 34px -12px var(--a1);touch-action:none}
.azmsg{min-height:24px;color:var(--a3);font-weight:600;text-align:center}
.azctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.azpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.azdpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.azdpad button,.azhold{border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.azdpad button:active,.azhold:active{background:var(--a1);color:var(--ink)}

/* modal */
.azmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px;background:rgba(5,2,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:azfade .2s;overflow:auto}
.azbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(40,20,80,.92),rgba(12,6,26,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000,0 0 60px -30px var(--a1);animation:azpop .3s}
.azbox h2{margin:0 0 4px;font-size:clamp(20px,5vw,26px)}
.azbox .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.azrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.azrow.c{justify-content:center}
.azlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.azstep{display:flex;align-items:center;gap:10px;justify-content:center}
.azstep b{min-width:140px;text-align:center;font-size:15px}
.azstep button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.azbig{font-size:clamp(34px,10vw,54px);text-align:center;margin:6px 0}
.azstat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.azstat div{text-align:center}.azstat b{display:block;font-size:22px;color:var(--a4)}.azstat small{color:var(--muted)}
.azcode{font-family:'Orbitron',sans-serif;font-size:38px;letter-spacing:8px;text-align:center;color:var(--a1);margin:10px 0;text-shadow:0 0 20px var(--a1)}
.azerr{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* shop */
.azshopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.azitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.azitem.eq{border-color:var(--a3);box-shadow:0 0 18px -8px var(--a3)}
.azitem .pv{font-size:34px;height:78px;display:grid;place-items:center}
.azitem .fig{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.azitem .fig svg{max-width:100%}
.azitem.eq .fig{box-shadow:inset 0 0 0 1px var(--a3)}
.azitem .sw{width:38px;height:38px;border-radius:50%;margin:auto;border:3px solid rgba(255,255,255,.7)}
.azitem b{display:block;font-size:13px}.azitem small{display:block;color:var(--muted);font-size:11px;min-height:28px}
.azitem .azbtn{width:100%;margin-top:6px}

/* toast */
.aztoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:rgba(20,10,40,.95);border:1px solid var(--a1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;animation:azpop .25s}

@keyframes azdrift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
@keyframes azrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes azpop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes azfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.coinbig,.azpill.coin,#azcoins,#hC,#hCoin,#mycoins{color:#ffbf24!important}.az-coin-icon{width:1.22em;height:1.22em;object-fit:contain;vertical-align:-.22em;display:inline-block;filter:drop-shadow(0 1px 2px rgba(255,190,30,.35))}</style>
</head>
<body data-game="leveldevil">
<main class="azgame" id="ldmain">
  <div class="azhud"><span class="azpill" id="hLv">Level 1 / 20</span><span class="azpill" id="hDeath">💀 0</span><span class="azpill" id="hName">—</span></div>
  <div class="azstage" id="stage"><canvas id="cv" width="800" height="450" style="width:min(100%,800px)"></canvas></div>
  <div class="azmsg" id="msg">Door tak pahucho. Bharosa mat karna! 😈</div>
  <div class="ldpad" id="pad">
    <div class="ldmv" id="mv" aria-label="Move: slide thumb left or right"><span id="bl">◀</span><span id="br">▶</span></div>
    <button class="ldj" id="bj" aria-label="Jump">⤒<small>JUMP</small></button>
  </div>
  <div class="azctl ldopts">
    <button class="azbtn sm" id="rotb">🔄 Rotate mode</button>
    <button class="azbtn ghost sm" id="swp">↔️ Swap hands</button>
    <button class="azbtn ghost sm" id="rst">🔄 Restart</button>
  </div>
  <p class="azmsg ldhint" style="color:var(--muted);font-size:12px;font-weight:400">📱 Controls feel small? Tap <b>Rotate mode</b> — the game opens in full landscape. You can slide your thumb between ◀ ▶.<br>⌨️ Arrow keys / A D move · Space / W / ↑ jump · R restart</p>
  <div class="ldtop" id="ldtop"><span class="azpill" id="rHud">Lv 1</span><span class="rbtns"><button class="azbtn-i" id="rst2" aria-label="Restart">↻</button><button class="azbtn-i" id="swp2" aria-label="Swap hands">↔</button><button class="azbtn-i" id="rotx" aria-label="Exit rotate mode">✖</button></span></div>
</main>
<style>
/* ---- Level Devil controls ---- */
#ldmain,.ldpad,.ldmv,.ldj{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ldpad{width:min(100%,800px);display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 4px;touch-action:none}
.ldpad.swap{flex-direction:row-reverse}
.ldmv{flex:1;max-width:380px;height:92px;display:grid;grid-template-columns:1fr 1fr;gap:8px;touch-action:none;cursor:pointer}
.ldmv span{pointer-events:none;display:grid;place-items:center;font-size:36px;border-radius:22px;border:1px solid var(--line);background:var(--panel2);transition:background .06s,transform .06s}
.ldj{width:140px;height:92px;border:0;border-radius:24px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);font:700 30px/1 'Orbitron',system-ui,sans-serif;display:grid;place-items:center;align-content:center;gap:2px;touch-action:none;cursor:pointer;box-shadow:0 10px 22px -10px var(--a1)}
.ldj small{font-size:12px;letter-spacing:2px}
.ldmv span.on{background:var(--a1);color:var(--ink);transform:scale(.95)}
.ldj.on{filter:brightness(1.25);transform:scale(.94)}
.ldopts .azbtn{touch-action:manipulation}
.ldtop{display:none}.rbtns{display:flex}
/* ---- Rotate mode: full-screen landscape. On a portrait phone the whole game is turned 90deg, so just tilt the phone. ---- */
body.ld-rot{overflow:hidden}
body.ld-rot .azbar,body.ld-rot .azbg,body.ld-rot .azhud,body.ld-rot .ldopts,body.ld-rot .ldhint,body.ld-rot #msg{display:none!important}
body.ld-rot #ldmain{--G:clamp(100px,15vmax,190px);position:fixed;inset:0;z-index:60;width:100%;height:100%;margin:0;padding:0;gap:0;display:block;background:#05020c}
body.ld-rot #stage{position:absolute;inset:0;display:block}
/* the game sits in the middle; the controls live in the two side gutters, so they never cover the player or the door */
body.ld-rot #cv{position:absolute;top:0;bottom:0;left:var(--G);width:calc(100% - 2*var(--G))!important;height:100%!important;max-width:none;object-fit:contain;border-radius:0;box-shadow:none}
body.ld-rot .ldpad{position:absolute;inset:0;width:auto;padding:0;display:block;pointer-events:none}
body.ld-rot .ldmv,body.ld-rot .ldj{position:absolute;bottom:4vmin;width:calc(var(--G) - 16px);height:min(32vmin,130px);max-width:none;flex:none;pointer-events:auto}
body.ld-rot .ldmv{left:8px;gap:6px}
body.ld-rot .ldj{right:8px}
body.ld-rot .ldpad.swap .ldmv{left:auto;right:8px}
body.ld-rot .ldpad.swap .ldj{right:auto;left:8px}
body.ld-rot .ldmv span{font-size:min(8vmin,34px);border-radius:16px}
body.ld-rot .ldj{font-size:min(7vmin,28px)}
body.ld-rot .ldtop{display:block;position:absolute;inset:0;z-index:3;pointer-events:none}
body.ld-rot #rHud{position:absolute;top:2.5vmin;left:8px;width:calc(var(--G) - 16px);text-align:center;white-space:pre-line;line-height:1.35;padding:6px 4px;border-radius:14px}
body.ld-rot .rbtns{position:absolute;top:2.5vmin;right:8px;width:calc(var(--G) - 16px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
body.ld-rot .rbtns .azbtn-i{width:44px;height:44px;font-size:18px}
@media (orientation:portrait){
  body.ld-rot #ldmain,body.ld-rot .azmodal{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  body.ld-rot .azbox{max-height:88vw}
}
@supports (height:100dvh){@media (orientation:portrait){body.ld-rot #ldmain,body.ld-rot .azmodal{left:100dvw;width:100dvh;height:100dvw}body.ld-rot .azbox{max-height:88dvw}}}
</style>
<script src="az.js?v=24"></script>
<script>
(function(){
'use strict';
const W=800,H=450,F=390,PW=26,PH=34,SPD=4.2,GRAV=.62,JV=12.2,$=id=>document.getElementById(id);

/* ============================ level building blocks ============================ */
const g=(a,b)=>({k:'g',x:a,y:F,w:b-a,h:60});                          // solid ground piece
const pl=(x,y,w)=>({k:'g',x,y,w:w||80,h:14,ow:1});                    // one-way platform (jump up through it)
const cr=(x,y,w,d)=>({k:'cr',x,y,w,h:y>=F?60:14,d:d||14,ow:y<F?1:0});  // crumbles d frames after you step on it
const hid=(x,y,w,h)=>({k:'hid',x,y,w,h});                            // invisible wall, shows when touched
const app=(x,y,w,h,tx,tr)=>({k:'app',x,y,w,h,tx,tr,ow:1});            // appears when you come near tx (+-tr)
const mv=(x1,y1,x2,y2,w,sp)=>({k:'mv',x:x1,y:y1,w,h:14,x1,y1,x2,y2,sp,ow:1});
const sp=(x,w,h)=>({k:'st',x,y:F-(h||26),w,h:h||26});                  // normal spikes on the floor
const pop=(x,w,h,r)=>({k:'pop',x,y:F-h,w,h,r});                      // spikes that jump out when you come close
const drop=(x,y,w,h,r)=>({k:'drop',x,y,w,h,r});                      // ceiling spikes that fall
const dash=(x,y,w,h,tx,s)=>({k:'dash',x,y,w,h,tx,sp:s});             // spikes that rush from the right
const saw=(x1,y1,x2,y2,r,s)=>({x1,y1,x2,y2,r,sp:s});
const DOOR={x:735,y:344};
function L(name,taunt,o){const d=Object.assign({name,taunt,s:[30,F-PH],so:[],sp:[],saw:[],fake:[]},o);d.door=Object.assign({w:30,h:46},DOOR,o.door||{});return d;}

const LEVELS=[
 /*1*/()=>L('Easy peasy','That easy? Think again... 😏',{so:[g(0,800)],sp:[pop(380,34,28,90)]}),
 /*2*/()=>L('Floor is a lie','Even the ground lies.',{so:[g(0,300),cr(300,F,120,3),g(420,800)]}),
 /*3*/()=>L('Shy door','The door is shy!',{so:[g(0,800),pl(570,300,110)],sp:[pop(300,30,26,80)],door:{x:735,y:344,run:[{x:605,y:254}],rr:120}}),
 /*4*/()=>L('Invisible walls','The wall is invisible...',{so:[g(0,800),hid(430,300,26,90),hid(610,290,26,100)]}),
 /*5*/()=>L('Look up!','Look up! 👆',{so:[g(0,800)],sp:[drop(240,230,56,46,115),pop(520,30,28,85),drop(620,200,50,50,60)]}),
 /*6*/()=>L('Elevator','Hop on the lift.',{so:[g(0,270),mv(280,F,440,F,90,1.8),g(530,800)],sp:[{k:'st',x:270,y:416,w:260,h:30},pop(650,30,28,80)]}),
 /*7*/()=>L('Which door?','Which door is the real one?',{so:[g(0,800),pl(130,320,90),pl(260,255,90),pl(390,190,90)],door:{x:425,y:144,w:30,h:46},fake:[{x:735,y:344}]}),
 /*8*/()=>L('Spike sea','Do not fall down.',{so:[g(0,120),pl(130,330,70),cr(250,330,70,12),pl(370,330,70),cr(490,330,70,12),pl(610,330,70),g(700,800)],sp:[sp(120,580,26)]}),
 /*9*/()=>L('Buzzsaw','The saw is running ⚙️',{so:[g(0,800)],saw:[saw(300,372,560,372,18,2.4)],sp:[pop(650,30,28,80)]}),
 /*10*/()=>L('Ambush','Attack from behind!',{so:[g(0,300),g(380,800)],sp:[dash(830,364,60,26,500,6.5)]}),
 /*11*/()=>L('Ghost bridge','The bridge is breaking!',{so:[g(0,250),cr(262,F,70,6),cr(362,F,70,6),cr(462,F,70,6),g(560,800)],sp:[pop(640,30,28,80)]}),

/* ============================ simulation (pure, so it can be tested) ============================ */
function build(n){
  const d=LEVELS[n-1]();
  const S={n,t:0,dead:0,won:false,why:'',
    p:{x:d.s[0],y:d.s[1],vx:0,vy:0,on:false,coy:0,jb:0,jl:false,face:1,ri:-1},
    so:d.so.map(s=>Object.assign({},s,{act:s.k!=='app',vis:s.k==='hid'?0:1,tm:0,vy:0,began:false,ph:0,dx:0,dy:0,len:s.k==='mv'?Math.hypot(s.x2-s.x1,s.y2-s.y1):0})),
    sp:d.sp.map(s=>Object.assign({},s,{on:false,f:s.k==='pop'?0:1,vy:0,done:false,x0:s.x,y0:s.y})),
    saw:d.saw.map(s=>Object.assign({},s,{ph:Math.random()*0,x:s.x1,y:s.y1,a:0,len:Math.hypot(s.x2-s.x1,s.y2-s.y1)||1})),
    door:Object.assign({i:0,sl:0,sx:0,sy:0,tx:0,ty:0,run:[],rr:0},d.door),
    fake:d.fake.map(f=>({x:f.x,y:f.y,w:30,h:46})),
    ev:[]};
  return S;
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const tri=v=>{v=v%2;return v<1?v:2-v;};
function die(S,why){if(!S.dead){S.dead=1;S.why=why;S.ev.push('die');}}

function step(S,inp){
  if(S.dead||S.won)return;
  S.t++;const p=S.p,pcx=p.x+PW/2;
  /* movers / crumblers / appearing blocks */
  for(const s of S.so){
    s.dx=0;s.dy=0;
    if(s.k==='mv'){const ox=s.x,oy=s.y;s.ph+=s.sp/s.len;const u=tri(s.ph);s.x=s.x1+(s.x2-s.x1)*u;s.y=s.y1+(s.y2-s.y1)*u;s.dx=s.x-ox;s.dy=s.y-oy;}
    else if(s.k==='cr'){ if(s.began){s.tm++; if(s.act&&s.tm>=s.d){s.act=false;} if(!s.act){s.vy+=.6;s.y+=s.vy;}} }
    else if(s.k==='app'&&!s.act){ if(Math.abs(pcx-s.tx)<s.tr){s.act=true;s.vis=0;} }
    if(s.k==='app'&&s.act&&s.vis<1)s.vis=Math.min(1,s.vis+.12);
  }
  if(p.ri>=0){const r=S.so[p.ri];if(r&&r.act){p.x+=r.dx;p.y+=r.dy;}}
  /* input */
  const ax=(inp.r?1:0)-(inp.l?1:0);p.vx=ax*SPD;if(ax)p.face=ax;
  if(inp.j){if(!p.jl)p.jb=7;p.jl=true;}else{p.jl=false;if(p.vy<-3.5)p.vy=-3.5;}
  if(p.on)p.coy=6;else if(p.coy>0)p.coy--;
  if(p.jb>0&&p.coy>0){p.vy=-JV;p.jb=0;p.coy=0;p.on=false;S.ev.push('jump');}
  if(p.jb>0)p.jb--;
  p.vy=Math.min(14,p.vy+GRAV);
  /* move X */
  p.x+=p.vx;if(p.x<0)p.x=0;if(p.x>W-PW)p.x=W-PW;
  for(const s of S.so){if(!s.act||s.ow)continue;if(hit({x:p.x,y:p.y,w:PW,h:PH},s)){if(p.vx>0)p.x=s.x-PW;else if(p.vx<0)p.x=s.x+s.w;if(s.k==='hid'&&s.vis===0){s.vis=.01;S.ev.push('reveal');}}}
  /* move Y */
  const pb=p.y+PH;p.y+=p.vy;p.on=false;let ri=-1;
  for(let i=0;i<S.so.length;i++){const s=S.so[i];if(!s.act)continue;if(!hit({x:p.x,y:p.y,w:PW,h:PH},s))continue;
    if(p.vy>=0&&(!s.ow||pb<=s.y+6+Math.max(0,s.dy))){p.y=s.y-PH;p.vy=0;p.on=true;ri=i;if(s.k==='cr')s.began=true;}
    else if(!s.ow){ if(p.vy<0){p.y=s.y+s.h;p.vy=0;if(s.k==='hid'&&s.vis===0){s.vis=.01;S.ev.push('reveal');}} }
  }
  p.ri=ri;
  for(const s of S.so)if(s.k==='hid'&&s.vis>0&&s.vis<1)s.vis=Math.min(1,s.vis+.15);
  if(p.y<-90){p.y=-90;if(p.vy<0)p.vy=0;}
  /* spikes */
  const pr={x:p.x+4,y:p.y+4,w:PW-8,h:PH-6};
  for(const s of S.sp){
    if(s.k==='pop'){ if(!s.on&&Math.abs(pcx-(s.x+s.w/2))<s.r){s.on=true;S.ev.push('pop');} if(s.on&&s.f<1)s.f=Math.min(1,s.f+1/5); }
    else if(s.k==='drop'){ if(!s.on&&Math.abs(pcx-(s.x+s.w/2))<s.r)s.on=true; if(s.on&&!s.done){s.vy+=.9;s.y+=s.vy;if(s.y+s.h>=F){s.y=F-s.h;s.done=true;S.ev.push('boom');}else if(s.y>H+120)s.done=true;} }
    else if(s.k==='dash'){ if(!s.on&&pcx>s.tx)s.on=true; if(s.on&&s.x>-120){s.x-=s.sp;} }
    const hb=s.k==='pop'?{x:s.x+3,y:s.y+s.h*(1-s.f),w:s.w-6,h:s.h*s.f}:{x:s.x+3,y:s.y+3,w:s.w-6,h:s.h-4};
    if(hb.h>3&&hit(pr,hb))die(S,'spike');
  }
  for(const z of S.saw){ z.a+=.25; const u=tri((S.t*z.sp)/z.len);z.x=z.x1+(z.x2-z.x1)*u;z.y=z.y1+(z.y2-z.y1)*u;
    const cx=Math.max(pr.x,Math.min(z.x,pr.x+pr.w)),cy=Math.max(pr.y,Math.min(z.y,pr.y+pr.h));
    if(Math.hypot(z.x-cx,z.y-cy)<z.r-3)die(S,'saw'); }
  if(p.y>H+60)die(S,'pit');
  /* doors */
  const d=S.door;
  if(d.sl>0){d.sl--;d.x=d.sx+(d.tx-d.sx)*(1-d.sl/14);d.y=d.sy+(d.ty-d.sy)*(1-d.sl/14);if(d.sl===0){d.x=d.tx;d.y=d.ty;}}
  else if(d.i<d.run.length&&Math.hypot(pcx-(d.x+d.w/2),p.y+PH/2-(d.y+d.h/2))<d.rr){const t=d.run[d.i++];d.sx=d.x;d.sy=d.y;d.tx=t.x;d.ty=t.y;d.sl=14;S.ev.push('hop');}
  for(const f of S.fake)if(hit(pr,{x:f.x+4,y:f.y+4,w:f.w-8,h:f.h-4}))die(S,'fake');
  if(!S.dead&&d.sl===0&&hit(pr,{x:d.x+4,y:d.y,w:d.w-8,h:d.h}))S.won=true;
}

/* ============================ rendering ============================ */
const cv=$('cv'),ctx=cv.getContext('2d');
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function drawSpikes(x,y,w,h,dir){const n=Math.max(1,Math.round(w/14)),sw=w/n;ctx.beginPath();for(let i=0;i<n;i++){ctx.moveTo(x+i*sw,y+h);ctx.lineTo(x+i*sw+sw/2,y);ctx.lineTo(x+(i+1)*sw,y+h);}ctx.closePath();ctx.fill();}
function drawDoor(d,fake,t){ctx.save();ctx.fillStyle=fake?'#7a3b2a':'#2d6b4a';rr(d.x-3,d.y-3,d.w+6,d.h+3,8);ctx.fill();ctx.fillStyle=fake?'#ffb199':'#b9ffd9';rr(d.x+3,d.y+3,d.w-6,d.h-3,6);ctx.fill();ctx.fillStyle='#1b1b2f';ctx.beginPath();ctx.arc(d.x+d.w-9,d.y+d.h/2+4,2.5,0,6.3);ctx.fill();if(!fake){ctx.shadowColor='#7dffb2';ctx.shadowBlur=14+4*Math.sin(t/12);ctx.strokeStyle='#7dffb2';ctx.lineWidth=2;rr(d.x-3,d.y-3,d.w+6,d.h+3,8);ctx.stroke();}ctx.restore();}
function draw(S,pl){
  const t=S.t;
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,pl.sky[0]);gr.addColorStop(1,pl.sky[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.25;ctx.fillStyle='#fff';for(let i=0;i<5;i++){const cx=(i*190+t*.15+40)%(W+160)-80;rr(cx,60+i*38%120,90,22,11);ctx.fill();}ctx.globalAlpha=1;
  for(const s of S.so){
    if(s.k==='hid'&&s.vis<=0)continue;
    if(s.k==='app'&&!s.act)continue;
    let ox=0;if(s.k==='cr'&&s.began&&s.act)ox=Math.sin(t*1.7)*2;
    ctx.globalAlpha=(s.k==='hid'||s.k==='app')?s.vis:1;
    const isG=s.k==='g'&&!s.ow||(s.k==='cr'&&s.h>20);
    ctx.fillStyle=isG?pl.ground:(s.k==='mv'?'#8d99ae':pl.ground);
    ctx.fillRect(s.x+ox,s.y,s.w,s.h);
    ctx.fillStyle=pl.accent;ctx.fillRect(s.x+ox,s.y,s.w,s.ow?6:7);
    if(s.k==='hid'){ctx.fillStyle=pl.ground;ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle=pl.accent;ctx.fillRect(s.x,s.y,s.w,6);}
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='#e63946';
  for(const s of S.sp){
    if(s.k==='pop'){if(s.f>0){const h=s.h*s.f;drawSpikes(s.x,s.y+s.h-h,s.w,h);}}
    else if(s.k==='drop'){ctx.fillStyle='#7b2d3a';ctx.fillRect(s.x,s.y,s.w,Math.min(10,s.h*.3));ctx.fillStyle='#e63946';ctx.save();ctx.translate(0,0);ctx.beginPath();const n=Math.max(1,Math.round(s.w/14)),sw=s.w/n;for(let i=0;i<n;i++){ctx.moveTo(s.x+i*sw,s.y+Math.min(10,s.h*.3));ctx.lineTo(s.x+i*sw+sw/2,s.y+s.h);ctx.lineTo(s.x+(i+1)*sw,s.y+Math.min(10,s.h*.3));}ctx.fill();ctx.restore();}
    else if(s.k==='dash'){if(s.on||s.x<W)drawSpikes(s.x,s.y,s.w,s.h);}
    else drawSpikes(s.x,s.y,s.w,s.h);
  }
  for(const z of S.saw){ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.a);ctx.fillStyle='#cfd8dc';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*z.r,Math.sin(a)*z.r);ctx.lineTo(Math.cos(a+Math.PI/10)*(z.r-6),Math.sin(a+Math.PI/10)*(z.r-6));}ctx.closePath();ctx.fill();ctx.fillStyle='#546e7a';ctx.beginPath();ctx.arc(0,0,4,0,6.3);ctx.fill();ctx.restore();}
  for(const f of S.fake)drawDoor(f,true,t);
  drawDoor(S.door,false,t);
  const p=S.p;
  if(!S.dead){ctx.fillStyle=HERO.color;rr(p.x,p.y,PW,PH,7);ctx.fill();ctx.fillStyle=pl.accent;ctx.fillRect(p.x+3,p.y+PH-5,PW-6,3);
    const ex=p.face>0?7:1;ctx.fillStyle='#fff';ctx.fillRect(p.x+4+ex,p.y+8,6,7);ctx.fillRect(p.x+13+ex-4,p.y+8,6,7);ctx.fillStyle='#111';ctx.fillRect(p.x+7+ex+(p.face>0?2:0),p.y+10,3,4);ctx.fillRect(p.x+16+ex-4+(p.face>0?2:0),p.y+10,3,4);
    if(HERO.hat){ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(HERO.hat,p.x+PW/2,p.y+3);}}
}
function drawGhost(){
  if(!ghost||!net)return;
  ghost.x+=(ghost.tx-ghost.x)*.35;ghost.y+=(ghost.ty-ghost.y)*.35;
  ctx.save();ctx.globalAlpha=ghost.d?.2:.6;ctx.fillStyle='#4cc9f0';rr(ghost.x,ghost.y,PW,PH,7);ctx.fill();
  ctx.globalAlpha=.95;ctx.fillStyle='#fff';ctx.font='bold 11px Poppins,sans-serif';ctx.textAlign='center';ctx.fillText(ghostName.slice(0,12),ghost.x+PW/2,ghost.y-6);ctx.restore();
}
const parts=[];
function burst(x,y){for(let i=0;i<22;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*8,l:1});}
function drawParts(){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.4;q.l-=.03;if(q.l<=0){parts.splice(i,1);continue;}ctx.globalAlpha=q.l;ctx.fillStyle='#e63946';ctx.fillRect(q.x,q.y,6,6);ctx.globalAlpha=1;}}

/* ============================ game flow ============================ */
let HERO={color:'#1d2433',hat:''},net=null,ghost=null,ghostName='Friend',tick=0,O=null,level=1,S=null,place=null,deaths=0,totalDeaths=0,held={l:0,r:0,j:0},acc=0,last=0,raf=0,paused=false,over=false,dieT=0;
const TAUNT=['Hehe, again! 😈','That was a trap!','Look carefully...','Not like that, like this!','The devil wins 😂','One more try!','I have more traps 😈'];
function hud(){$('hLv').textContent='Level '+level+' / '+LEVELS.length;$('hDeath').textContent='💀 '+deaths;$('hName').textContent=S?LEVELS[level-1]().name:'—';$('rHud').textContent='Lv '+level+'\n💀 '+deaths;}
function begin(n){HERO=Az.eq('hero');ghost=null;tick=0;level=Math.max(1,Math.min(LEVELS.length,n|0));place=Az.place(level);S=build(level);deaths=0;over=false;dieT=0;parts.length=0;acc=0;last=performance.now();held={l:0,r:0,j:0};hud();$('msg').textContent=LEVELS[level-1]().taunt;if(!raf)raf=requestAnimationFrame(loop);}
function respawn(){S=build(level);dieT=0;parts.length=0;$('msg').textContent=TAUNT[(Math.max(1,deaths)-1)%TAUNT.length];hud();}
function win(){over=true;Az.sfx('win');
  if(net){
    net.send({t:'win'});
    Az.finish({game:'leveldevil',level,diff:'medium',won:true,base:30,score:Math.max(0,1000-deaths*50),progress:false,
      title:'🏁 You got there first!',sub:deaths?('Deaths: '+deaths+' — '+ghostName+' was left behind!'):'Not a single death! 😈',retry:()=>rematch()});
    return;
  }
  Az.finish({game:'leveldevil',level,diff:'medium',won:true,base:Math.max(10,26-deaths),score:Math.max(0,1000-deaths*50),
    title:'😈 Level '+level+' clear!',sub:deaths?('Deaths: '+deaths+' — the devil trolled you a lot.'):'Not a single death! Are you a god?',
    next:lv=>begin(lv),retry:lv=>begin(lv)});}
/* ---- online race: both players get the SAME level (from the shared seed); first to the real door wins ---- */
const lvOf=seed=>1+((seed>>>0)%LEVELS.length);
function rematch(){
  if(!net)return;
  if(O.host){const seed=Math.floor(Math.random()*1e9);net.send({t:'again',seed});begin(lvOf(seed));}
  else{net.send({t:'ask'});Az.toast('Host ka wait… ⏳',2500);}
}
function onNet(m){
  if(!m)return;
  if(m.t==='p'){ if(!ghost)ghost={x:m.x,y:m.y,tx:m.x,ty:m.y,d:0};ghost.tx=m.x;ghost.ty=m.y;ghost.d=m.d; }
  else if(m.t==='win'){ if(over)return; over=true;Az.sfx('lose');
    Az.finish({game:'leveldevil',level,diff:'medium',won:false,base:30,progress:false,title:'😔 '+ghostName+' got there first',sub:'Play a rematch and get revenge!',retry:()=>rematch()}); }
  else if(m.t==='again'&&!O.host){begin(lvOf(m.seed));}
  else if(m.t==='ask'&&O.host){rematch();}
}
function frame(){
  if(net&&S&&++tick%3===0)net.send({t:'p',x:Math.round(S.p.x),y:Math.round(S.p.y),d:S.dead?1:0,dt:deaths});
  const inp={l:held.l,r:held.r,j:held.j};
  if(!S.dead&&!S.won)step(S,inp);
  for(const e of S.ev){ if(e==='jump')Az.sfx('jump'); else if(e==='pop'||e==='boom'||e==='reveal'||e==='hop')Az.sfx('pop'); else if(e==='die'){Az.sfx('hit');burst(S.p.x+PW/2,S.p.y+PH/2);deaths++;totalDeaths++;hud();} }
  S.ev.length=0;
  if(S.dead){dieT++;if(dieT>38)respawn();}
  else if(S.won&&!over)win();
}
function loop(t){
  raf=requestAnimationFrame(loop);
  if(!S||paused){last=t;return;}
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){acc-=1000/60;if(!over)frame();}
  draw(S,place);drawGhost();drawParts();paintPad();
}
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();});

/* ============================ controls ============================ */
const KEY={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{const k=KEY[e.key];if(k){held[k]=1;e.preventDefault();}else if(e.key==='r'||e.key==='R'){if(S&&!over)respawn();}});
addEventListener('keyup',e=>{const k=KEY[e.key];if(k){held[k]=0;e.preventDefault();}});
addEventListener('blur',()=>{held={l:0,r:0,j:0};});
/* Move pad: ONE touch area. Thumb on the left half = ◀, right half = ▶, and you can slide between them without lifting. */
const mvEl=$('mv'),bl=$('bl'),brr=$('br'),bj=$('bj'),pad=$('pad');let mvId=null;
function setDir(e){const w=mvEl.clientWidth||1,x=e.offsetX;held.l=x<w*.5?1:0;held.r=x>=w*.5?1:0;}
mvEl.addEventListener('pointerdown',e=>{e.preventDefault();if(mvId!==null)return;mvId=e.pointerId;try{mvEl.setPointerCapture(e.pointerId);}catch(x){}setDir(e);});
mvEl.addEventListener('pointermove',e=>{if(e.pointerId===mvId){e.preventDefault();setDir(e);}});
const mvOff=e=>{if(e.pointerId===mvId){mvId=null;held.l=0;held.r=0;}};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>mvEl.addEventListener(n,mvOff));
let jId=null;
bj.addEventListener('pointerdown',e=>{e.preventDefault();jId=e.pointerId;held.j=1;try{bj.setPointerCapture(e.pointerId);}catch(x){}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>bj.addEventListener(n,e=>{if(e.pointerId===jId){jId=null;held.j=0;}}));
[mvEl,bj,pad].forEach(b=>b.addEventListener('contextmenu',e=>e.preventDefault()));
function paintPad(){bl.classList.toggle('on',!!held.l);brr.classList.toggle('on',!!held.r);bj.classList.toggle('on',!!held.j);}
const doRestart=()=>{if(S&&!over)respawn();};
$('rst').onclick=doRestart;$('rst2').onclick=doRestart;

let rot=false;
const uiPref=()=>Az.get('ldui')||{};
function savePref(k,v){const u=Object.assign({},uiPref());if(u[k]===v)return;u[k]=v;Az.set('ldui',u);}
function setSwap(on){pad.classList.toggle('swap',!!on);savePref('swap',on?1:0);}
function setRot(on){
  rot=!!on;document.body.classList.toggle('ld-rot',rot);$('rotb').textContent=rot?'📱 Normal mode':'🔄 Rotate mode';
  try{
    const de=document.documentElement;
    if(rot){const rf=de.requestFullscreen||de.webkitRequestFullscreen;if(rf)Promise.resolve(rf.call(de)).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});}
    else{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(x){}}
  }catch(x){}
  savePref('rot',rot?1:0);
}
$('rotb').onclick=()=>setRot(!rot);$('rotx').onclick=()=>setRot(false);
$('swp').onclick=()=>setSwap(!pad.classList.contains('swap'));$('swp2').onclick=()=>setSwap(!pad.classList.contains('swap'));
if(uiPref().swap)pad.classList.add('swap');
addEventListener('pagehide',()=>{held={l:0,r:0,j:0};});

window.__LD={LEVELS,build,step,hit,PW,PH,W,H,get S(){return S;},begin:n=>{O=O||{};begin(n);},over:()=>over};
const _p=uiPref(),viewOpts=_p.rot?[['r','🔄 Rotate mode (landscape)'],['n','📱 Normal']]:[['n','📱 Normal'],['r','🔄 Rotate mode (landscape)']];
Az.start({game:'leveldevil',noDiff:true,extra:[{key:'view',label:'Screen / Controls',options:viewOpts}],onStart:o=>{
  O=o;net=o.mode==='online'?o.net:null;
  setRot(o.mode==='online'?!!uiPref().rot:(o.extra&&o.extra.view==='r'));   // online: joiner gets host's extra, so use own saved choice
  if(net){
    ghostName=(net.peer&&net.peer.name)||'Friend';
    net.on(onNet);
    setInterval(()=>{if(net&&net.peer&&net.peer.name)ghostName=net.peer.name;},800);
    net.onclose(()=>{if(!over){over=true;Az.finish({game:'leveldevil',level,diff:'medium',won:true,base:15,progress:false,title:'Friend left',sub:'Your friend left the game.',retry:()=>location.reload()});}});
    $('rst').hidden=false;begin(lvOf(o.seed));
    $('msg').textContent='🏁 Race! First to reach the door wins — '+'the 🔵 ghost is your opponent.';
  }else begin(o.level);
}});
})();
</script>
