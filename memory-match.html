<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest?v=21"><link rel="icon" href="./icon-64.png?v=21" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=21"><link rel="shortcut icon" href="favicon.ico?v=21"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=21"></head><body data-game="memory"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">🧠</div><h1>Memory Match</h1><p class="sub">Flip cards and find every matching pair.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=21"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false;function finish(won,sub){if(done)return;done=true;Az.finish({game:'memory',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}function start(){Az.start({game:'memory',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;run()}})}$('start').onclick=start;const symbols=['🍒','🚀','🐼','⭐','🎧','🍀','🦊','💎'];let deck=[],open=[],matched=0,moves=0;function run(){deck=[...symbols.slice(0,Math.min(4+Math.floor(level/4),8)),...symbols.slice(0,Math.min(4+Math.floor(level/4),8))].sort(()=>Math.random()-.5);open=[];matched=0;moves=0;draw()}function draw(){ $('gamearea').innerHTML='<p>Pairs: '+matched+' · Moves: '+moves+'</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+deck.map((v,i)=>'<button class="azchip" data-i="'+i+'" style="height:68px;font-size:26px">'+(open.includes(i)||deck[i]===null?v:'❔')+'</button>').join('')+'</div>'; $('gamearea').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(open.includes(i)||deck[i]===null||open.length===2)return;open.push(i);if(open.length===2){moves++;let [a,c]=open;if(deck[a]===deck[c]){deck[a]=deck[c]=null;matched++;open=[];if(matched===deck.length/2)finish(true,'All pairs found in '+moves+' moves.')}else setTimeout(()=>{open=[];draw()},650)}draw()})} })();</script></body></html>
