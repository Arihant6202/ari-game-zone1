<!doctype html><html lang="en"><head>
    <meta name="description" content="Play Memory Match at Ari Game Zone. Flip cards, remember their positions, and match pairs in this free puzzle game."><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ari Games"><script src="firebase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match – Free Puzzle Game | Ari Game Zone</title><link rel="stylesheet" href="az.css?v=1.04.00">    <link rel="canonical" href="https://arihant6202.github.io/ari-game-zone1/memory-match.html">
</head><body data-game="memory"><main class="azgame"><section class="azpanel" style="width:100%;max-width:620px;text-align:center"><div class="azbig">🧠</div><h1>Memory Match</h1><p class="sub">Flip cards and find every pair. Harder levels have more cards and a move limit.</p><div id="gamearea"></div><p id="status" class="azmsg">Choose Play to begin.</p><div class="azrow c"><button id="start" class="azbtn">▶ Play</button><a class="azbtn ghost" href="index.html">🏠 Home</a></div></section></main><script src="az.js?v=1.07.00"></script><script>(()=>{const $=id=>document.getElementById(id);let level=1,diff='medium',score=0,done=false,running=false;
function finish(won,sub){if(done)return;done=true;running=false;$('start').style.display='';Az.finish({game:'memory',level,diff,won,base:35,score,sub,progress:true,retry:()=>location.reload()})}
function start(){if(running)return;Az.start({game:'memory',onStart:o=>{level=o.level;diff=o.diff;score=0;done=false;running=true;$('start').style.display='none';run()}})}
$('start').onclick=start;

const SYM=['🍒','🚀','🐼','⭐','🎧','🍀','🦊','💎','🐙','🍕'];
let deck=[],open=[],matched=0,moves=0,pairs=4,maxMoves=99,lock=false;
function run(){pairs=Math.min(4+Math.floor(level/5),10);maxMoves=diff==='easy'?999:Math.ceil(pairs*(diff==='hard'?2.2:3.2));
 deck=[...SYM.slice(0,pairs),...SYM.slice(0,pairs)].map((v,i)=>({v,up:false,ok:false})).sort(()=>Math.random()-.5);open=[];matched=0;moves=0;lock=false;draw()}
function draw(){const cols=pairs>8?5:4;$('gamearea').innerHTML='<p>Pairs <b>'+matched+'</b>/'+pairs+' · Moves <b>'+moves+'</b>'+(maxMoves<999?' / '+maxMoves:'')+'</p><div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:8px">'+deck.map((c,i)=>'<button class="azchip" data-i="'+i+'" style="height:68px;font-size:28px;'+(c.ok?'opacity:.45;':'')+'">'+(c.up||c.ok?c.v:'❔')+'</button>').join('')+'</div>';
 $('gamearea').querySelectorAll('button').forEach(b=>b.onclick=()=>flip(+b.dataset.i))}
function flip(i){const c=deck[i];if(done||lock||c.up||c.ok)return;c.up=true;open.push(i);Az.sfx('click');
 if(open.length===2){moves++;const [a,b]=open;
  if(deck[a].v===deck[b].v){deck[a].ok=deck[b].ok=true;deck[a].up=deck[b].up=false;matched++;open=[];Az.sfx('coin');score=Math.max(10,pairs*100-moves*10);draw();
   if(matched===pairs)finish(true,'All '+pairs+' pairs found in '+moves+' moves.');}
  else{lock=true;draw();setTimeout(()=>{deck[a].up=deck[b].up=false;open=[];lock=false;if(moves>=maxMoves&&!done){finish(false,'Out of moves! Found '+matched+' of '+pairs+' pairs.');return}draw()},700)}
 }else draw()}
})();</script></body></html>
