<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="./icon-64.png?v=20" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20"><link rel="shortcut icon" href="favicon.ico?v=20"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:image" content="./share-image.png?v=20"><title>Profile · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=20"><link rel="stylesheet" href="v17.css?v=20"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="profile"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>👤 Profile</h1></div><section class="azpanel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="avatar" data-az="avatar" style="width:84px;height:84px;font-size:42px">😎</div><div style="flex:1;min-width:200px"><h2 style="margin:0"><span data-az="name"></span></h2><div style="color:var(--muted);font-size:13px">🆔 <span data-az="uid"></span> · Level <b data-az="plvl">1</b></div><div class="xpb" style="margin:8px 0 4px"><i id="xp"></i></div><small id="xpt" style="color:var(--muted)"></small></div><span class="azpill coin" style="font-size:16px">🪙 <b data-az="coins">0</b> Gold</span></section><section class="azpanel" id="chpanel" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px"></section><div class="azrow" style="margin:14px 0"><button class="azbtn" id="edit">✏️ Edit profile</button><button class="azbtn ghost" id="acct">🔐 Login / Logout</button></div><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">🏆 Level Rewards</h2><p style="color:var(--muted);font-size:12px;margin:0 0 10px">+100 Gold every level. Every 5th level also gives a special item.</p><div class="grid2" id="lr"></div><button class="azbtn ghost sm" id="lrall" style="margin-top:10px">View rewards up to Level 100</button></section><section class="azpanel"><h2 style="margin:0 0 8px">Game progress</h2><div id="prog"></div></section></div><script src="az.js?v=22"></script><script src="nav.js"></script><script>
function charPanel(){const c=Az.char(),pt=Az.perkText();document.getElementById('chpanel').innerHTML='<div style="width:70px;text-align:center">'+Az.figure(c)+'</div><div style="flex:1;min-width:180px"><small style="color:var(--muted)">MY CHARACTER</small><h2 style="margin:2px 0">'+c.name+'</h2><div style="font-size:13px;color:var(--muted)">'+(pt||'No bonus')+'</div></div><button class="azbtn sm" id="chbtn">Change character</button>';document.getElementById('chbtn').onclick=function(){const m=Az.shop(['char']);const iv=setInterval(function(){if(!document.body.contains(m)){clearInterval(iv);charPanel()}},400)}}
function draw(){charPanel();const p=Az.plProgress();document.getElementById('xp').style.width=Math.min(100,p.cur/p.need*100)+'%';document.getElementById('xpt').textContent=p.cur+' / '+p.need+' XP to next level';
 document.getElementById('prog').innerHTML=Az.GAMES.map(g=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+g.emoji+' '+g.name+'</span><b>Lv '+Az.level(g.id)+' / '+g.max+'</b></div>').join('');
 document.getElementById('acct').textContent=Az.account()?'🚪 Logout ('+(Az.account().email||'account')+')':'🔐 Login with Google'}
function itemHTML(it){if(!it)return '';const r=Az.rarity(it);return '<span style="display:block;margin-top:3px;font-size:11px;font-weight:700;color:'+r.c+'">'+Az.SHOP[it.slot].emoji+' '+it.name+'<br><small>'+r.n+'</small></span>'}
function lr(){const cur=Az.plvl();document.getElementById('lr').innerHTML=Az.rewardPreview(cur,10).map(function(r){return '<div class="tile"><b style="font-size:16px">Level '+r.level+'</b>+100 🪙'+itemHTML(r.item)+'</div>'}).join('')}
document.getElementById('lrall').onclick=function(){const m=Az.modal('<h2>🏆 Level Rewards — 1 to 100</h2><div id="lra" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:60vh;overflow:auto"></div><div class="azrow c"><button class="azbtn ghost" id="lrc">Close</button></div>');m.querySelector('#lra').innerHTML=Array.from({length:100},function(_,i){const it=Az.levelItem(i+1);return '<div class="azitem"><b>Lv '+(i+1)+'</b><small> +100 🪙</small>'+itemHTML(it)+'</div>'}).join('');m.querySelector('#lrc').onclick=function(){m.close()}};
lr();document.addEventListener('az-account',lr);
document.getElementById('edit').onclick=()=>Az.profile();document.getElementById('acct').onclick=()=>Az.account()?Az.logout():Az.login();draw();document.addEventListener('az-account',draw);</script></body></html>
