<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ari-game-zone-icon.svg" type="image/svg+xml"><title>Profile · Ari Game Zone</title><link rel="stylesheet" href="az.css"><link rel="stylesheet" href="v17.css"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="profile"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>👤 Profile</h1></div><section class="azpanel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="avatar" data-az="avatar" style="width:84px;height:84px;font-size:42px">😎</div><div style="flex:1;min-width:200px"><h2 style="margin:0"><span data-az="name"></span></h2><div style="color:var(--muted);font-size:13px">🆔 <span data-az="uid"></span> · Level <b data-az="plvl">1</b></div><div class="xpb" style="margin:8px 0 4px"><i id="xp"></i></div><small id="xpt" style="color:var(--muted)"></small></div><span class="azpill coin" style="font-size:16px">🪙 <b data-az="coins">0</b> Gold</span></section><div class="azrow" style="margin:14px 0"><button class="azbtn" id="edit">✏️ Edit profile</button><button class="azbtn ghost" id="acct">🔐 Login / Logout</button></div><section class="azpanel"><h2 style="margin:0 0 8px">Game progress</h2><div id="prog"></div></section></div><script src="az.js?v=17"></script><script src="nav.js"></script><script>
function draw(){const p=Az.plProgress();document.getElementById('xp').style.width=Math.min(100,p.cur/p.need*100)+'%';document.getElementById('xpt').textContent=p.cur+' / '+p.need+' XP to next level';
 document.getElementById('prog').innerHTML=Az.GAMES.map(g=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+g.emoji+' '+g.name+'</span><b>Lv '+Az.level(g.id)+' / '+g.max+'</b></div>').join('');
 document.getElementById('acct').textContent=Az.account()?'🚪 Logout ('+(Az.account().email||'account')+')':'🔐 Login with Google'}
document.getElementById('edit').onclick=()=>Az.profile();document.getElementById('acct').onclick=()=>Az.account()?Az.logout():Az.login();draw();document.addEventListener('az-account',draw);</script></body></html>
