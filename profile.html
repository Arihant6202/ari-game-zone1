<!DOCTYPE html><html lang="en"><head><script src="firebase-config.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b24"><link rel="manifest" href="manifest.webmanifest?v=21"><link rel="icon" href="./icon-64.png?v=21" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=21"><link rel="shortcut icon" href="favicon.ico?v=21"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:image" content="./share-image.png?v=21"><title>Profile · Ari Game Zone</title><link rel="stylesheet" href="az.css?v=21"><link rel="stylesheet" href="v17.css?v=21"><style>.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pgh h1{margin:0;font-size:24px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:center}.tile b{display:block;font-size:34px}.xpb{height:10px;border-radius:8px;background:var(--panel);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}</style></head><body data-page="profile"><div class="azbg"><i></i><i></i><i></i></div><div id="pg"><div class="pgh"><h1>👤 Profile</h1></div><section class="azpanel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="avatar" data-az="avatar" style="width:84px;height:84px;font-size:42px">😎</div><div style="flex:1;min-width:200px"><h2 style="margin:0"><span data-az="name"></span></h2><div style="color:var(--muted);font-size:13px">🆔 <span data-az="uid"></span> · Level <b data-az="plvl">1</b></div><div class="xpb" style="margin:8px 0 4px"><i id="xp"></i></div><small id="xpt" style="color:var(--muted)"></small></div><span class="azpill coin" style="font-size:16px">🪙 <b data-az="coins">0</b> Gold</span></section><div class="azrow" style="margin:14px 0"><button class="azbtn" id="edit">✏️ Edit profile</button><button class="azbtn ghost" id="acct">🔐 Login / Logout</button></div>
<section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 10px">⚙️ Account & Rewards</h2>
<div class="azrow"><button class="azbtn sm" id="daily">🎁 Daily bonus</button><button class="azbtn sm ghost" id="mailbtn">✉️ Mail <span id="mailcount"></span></button><button class="azbtn sm ghost" id="admincoins">⚙️ My Coins</button></div>
<div style="margin-top:10px;color:var(--muted);font-size:12px">App theme</div><div class="themes" id="themes" aria-label="Choose theme"></div></section><section class="azpanel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">🏆 Level Rewards</h2><p style="color:var(--muted);font-size:12px;margin:0 0 10px">+100 Gold every level. Every 5th level also gives a special item.</p><div class="grid2" id="lr"></div><button class="azbtn ghost sm" id="lrall" style="margin-top:10px">View rewards up to Level 100</button></section><section class="azpanel"><h2 style="margin:0 0 8px">Game progress</h2><div id="prog"></div></section></div><script src="az.js?v=21"></script><script src="nav.js"></script><script>
function draw(){const p=Az.plProgress();document.getElementById('xp').style.width=Math.min(100,p.cur/p.need*100)+'%';document.getElementById('xpt').textContent=p.cur+' / '+p.need+' XP to next level';
 document.getElementById('prog').innerHTML=Az.GAMES.map(g=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+g.emoji+' '+g.name+'</span><b>Lv '+Az.level(g.id)+' / '+g.max+'</b></div>').join('');
 document.getElementById('acct').textContent=Az.account()?'🚪 Logout ('+(Az.account().email||'account')+')':'🔐 Login with Google'}
function itemHTML(it){if(!it)return '';const r=Az.rarity(it);return '<span style="display:block;margin-top:3px;font-size:11px;font-weight:700;color:'+r.c+'">'+Az.SHOP[it.slot].emoji+' '+it.name+'<br><small>'+r.n+'</small></span>'}
function lr(){const cur=Az.plvl();document.getElementById('lr').innerHTML=Az.rewardPreview(cur,10).map(function(r){return '<div class="tile"><b style="font-size:16px">Level '+r.level+'</b>+100 🪙'+itemHTML(r.item)+'</div>'}).join('')}
document.getElementById('lrall').onclick=function(){const m=Az.modal('<h2>🏆 Level Rewards — 1 to 100</h2><div id="lra" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:60vh;overflow:auto"></div><div class="azrow c"><button class="azbtn ghost" id="lrc">Close</button></div>');m.querySelector('#lra').innerHTML=Array.from({length:100},function(_,i){const it=Az.levelItem(i+1);return '<div class="azitem"><b>Lv '+(i+1)+'</b><small> +100 🪙</small>'+itemHTML(it)+'</div>'}).join('');m.querySelector('#lrc').onclick=function(){m.close()}};
lr();document.addEventListener('az-account',lr);
document.getElementById('edit').onclick=()=>Az.profile();document.getElementById('acct').onclick=()=>Az.account()?Az.logout():Az.login();
document.getElementById('daily').onclick=()=>{const t=new Date().toDateString();if(Az.get('daily')===t)return;Az.set('daily',t);Az.addCoins(Az.DAILY_BONUS);Az.sfx('coin');Az.toast('🎁 +'+Az.DAILY_BONUS+' coins! Come back tomorrow.');paintDaily();};
function paintDaily(){const b=document.getElementById('daily');if(!b)return;const claimed=Az.get('daily')===new Date().toDateString();b.disabled=claimed;b.textContent=claimed?'✅ Claimed today':'🎁 Daily bonus';}
document.getElementById('mailbtn').onclick=()=>Az.mailbox();
function paintMail(){const b=document.getElementById('mailcount');if(b)b.textContent=Az.mailCount()?'('+Az.mailCount()+')':'';}
document.addEventListener('az-mail',paintMail);document.addEventListener('az-ready',paintMail);document.addEventListener('az-account',paintMail);
document.getElementById('admincoins').onclick=()=>{if(Az.isOwner())location.href='owner-admin.html';else Az.toast('Developer tools are only available to the verified owner.');};
const th=document.getElementById('themes');['neon','sunset','ocean','forest'].forEach(t=>{const b=document.createElement('button');b.className='dot';b.dataset.t=t;b.title=t;b.setAttribute('aria-label',t+' theme');b.onclick=()=>{Az.setTheme(t);markTheme();};th.appendChild(b);});
function markTheme(){th.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.t===Az.get('theme')));}
function refreshProfile(){draw();paintDaily();paintMail();markTheme();}
draw();refreshProfile();document.addEventListener('az-account',refreshProfile);</script></body></html>
